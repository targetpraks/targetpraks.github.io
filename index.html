<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ricardo Maio — GitHub Pages</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0f;
    color: #e0ddd6;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; text-align: center;
  }
  .card {
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 48px;
    max-width: 500px;
  }
  h1 { font-size: 2rem; color: #f5f0e8; font-weight: 400; margin-bottom: 8px; }
  p { color: #8a887f; margin-bottom: 24px; }
  a {
    display: block;
    background: #1a1a28;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 16px 24px;
    margin: 8px 0;
    color: #d4a853;
    text-decoration: none;
    font-size: 1.1rem;
    transition: background 0.2s;
  }
  a:hover { background: #222236; }
  a .emoji { margin-right: 8px; }
</style>
</head>
<body>
<div class="card">
  <h1>Ricardo Maio</h1>
  <p>Personal GitHub Pages</p>
  <a href="/garden-plan"><span class="emoji">🌱</span> Welgemoed Garden Plan</a>
</div>
</body>
</html>
