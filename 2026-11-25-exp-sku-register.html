const tb=document.getElementById('tb'), q=document.getElementById('q'), cat=document.getElementById('cat'), cnt=document.getElementById('count');
let state={q:'',cat:'',st:'all',sort:'sku',dir:1};
const money=n=>'R'+n.toLocaleString('en-ZA',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(/,/g,' ');
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function render(){
  let rows=DATA.filter(d=>{
    if(state.st!=='all'&&d.status!==state.st) return false;
    if(state.cat&&d.cat!==state.cat) return false;
    if(state.q){const s=(d.sku+' '+d.name+' '+d.cat).toLowerCase(); if(!s.includes(state.q.toLowerCase())) return false;}
    return true;
  });
  rows.sort((a,b)=>{const k=state.sort; let x=a[k],y=b[k];
    if(typeof x==='string'){x=x.toLowerCase();y=y.toLowerCase();}
    return (x>y?1:x<y?-1:0)*state.dir;});
  cnt.textContent=rows.length+' of '+DATA.length+' shown';
  tb.innerHTML=rows.map(d=>'<tr>'+
    '<td class="mono">'+esc(d.sku)+'</td>'+
    '<td>'+esc(d.name)+'</td>'+
    '<td class="small">'+esc(d.cat)+'</td>'+
    '<td><span class="pill '+(d.status==='active'?'a':'i')+'">'+d.status+'</span></td>'+
    '<td class="n">'+(d.rate?money(d.rate):'&mdash;')+'</td>'+
    '<td class="n">'+(d.buy?money(d.buy):'&mdash;')+'</td>'+
    '<td class="n">'+(d.stock?d.stock.toLocaleString('en-ZA'):'&mdash;')+'</td>'+
    '<td class="small">'+esc(d.unit)+'</td></tr>').join('');
}
q.addEventListener('input',e=>{state.q=e.target.value;render();});
cat.addEventListener('change',e=>{state.cat=e.target.value;render();});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on'); state.st=c.dataset.st; render();}));
document.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
  const k=th.dataset.k; if(!k) return;
  if(state.sort===k) state.dir*=-1; else {state.sort=k;state.dir=1;}
  render();}));
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus();}});
render();
</script></body></html>
