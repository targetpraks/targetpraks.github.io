<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Papa Pasta — motion set</title>
<style>
  :root{--black:#000;--white:#fff;--lime:#C9F034;--silver:#C0C0C0;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--black);color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
  header{padding:calc(24px + env(safe-area-inset-top)) 20px 18px;border-bottom:1px solid rgba(192,192,192,.28)}
  .k{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--lime);margin-bottom:12px}
  h1{margin:0;font-size:clamp(30px,9vw,44px);font-weight:900;letter-spacing:-.04em;line-height:.92;text-transform:uppercase}
  h1 em{font-style:normal;color:var(--lime)}
  .sub{margin-top:12px;color:var(--silver);font-size:13.5px;line-height:1.5;max-width:34ch}
  main{padding:16px 12px 40px}
  .card{margin:0 0 22px;border:1px solid rgba(192,192,192,.3);background:#000;overflow:hidden}
  .card video{display:block;width:100%;height:auto;background:#000;aspect-ratio:9/16}
  .card.wide video{aspect-ratio:16/9}
  .card.square video{aspect-ratio:1/1}
  .meta{padding:12px 14px 14px;border-top:1px solid rgba(192,192,192,.2)}
  .n{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--lime);margin-bottom:5px}
  .t{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
  .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--silver);margin-top:5px}
  footer{padding:0 20px 48px;color:var(--silver);font-size:12px;line-height:1.6}
  footer b{color:#fff}
  .hint{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--lime);
    padding:0 20px 14px}
</style>
</head>
<body>
<header>
  <div class="k">Papa Pasta · motion set</div>
  <h1>Four pieces.<br><em>One beat.</em></h1>
  <p class="sub">Tap to play. Scored with an original phonk bed built on this Mac — no library music.</p>
</header>

<p class="hint">Tap a piece to play · sound on</p>

<main>
  <figure class="card">
    <video src="assets/papa-pasta-motion/pp-teaser.mp4" poster="assets/papa-pasta-motion/pp-teaser.jpg"
           controls playsinline preload="metadata" x-webkit-airplay="allow"></video>
    <figcaption class="meta"><div class="n">01 · teaser</div><div class="t">Carb Hard</div><div class="m">9:16 · 12 s · 96 BPM</div></figcaption>
  </figure>

  <figure class="card wide">
    <video src="assets/papa-pasta-motion/pp-concept.mp4" poster="assets/papa-pasta-motion/pp-concept.jpg"
           controls playsinline preload="metadata" x-webkit-airplay="allow"></video>
    <figcaption class="meta"><div class="n">02 · film</div><div class="t">A pasta kitchen you can see</div><div class="m">16:9 · 20 s · 96 BPM</div></figcaption>
  </figure>

  <figure class="card square">
    <video src="assets/papa-pasta-motion/pp-unit.mp4" poster="assets/papa-pasta-motion/pp-unit.jpg"
           controls playsinline preload="metadata" x-webkit-airplay="allow"></video>
    <figcaption class="meta"><div class="n">03 · technical</div><div class="t">Designed around the unit</div><div class="m">1:1 · 16 s · 96 BPM</div></figcaption>
  </figure>

  <figure class="card">
    <video src="assets/papa-pasta-motion/pp-sting.mp4" poster="assets/papa-pasta-motion/pp-sting.jpg"
           controls playsinline preload="metadata" x-webkit-airplay="allow"></video>
    <figcaption class="meta"><div class="n">04 · sting</div><div class="t">Crest + lockup</div><div class="m">9:16 · 8 s · 140 BPM</div></figcaption>
  </figure>
</main>

<footer>
  <b>Music.</b> Generated locally with original synthesis — no SoundCloud or library licence to clear.
</footer>
</body>
</html>
