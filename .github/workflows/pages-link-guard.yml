name: published links

# Every page on this site is a URL somebody holds — in a vault note, on a jump link, in Ricardo's
# chat. Twice they have gone dead without anyone noticing until he clicked: a page deleted by a
# dedupe pass (2026-11-02) and a page renamed by a pull request merged on github.com (2026-11-02),
# which no local git hook can see.
#
# This is the only check that runs where a web merge happens. It needs nothing but the checkout:
# lens 1 = every ledger URL answers 200; lens 2 = every name that ever held a ledger row still
# exists. The vault lens (the links a note actually quotes) needs Ricardo's vault and is not here:
#   python3 ~/.config/maio-stack/tools/pages_link_check.py check
#
# Rule and rationale: ~/.config/maio-stack/docs/document-publishing-convention.md §2.5.2

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"          # 06:23 SAST, before the day starts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every published page still answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the ledger's whole history is lens 2
      - name: audit the published URLs and names
        run: python3 .github/pages_link_check_ci.py
