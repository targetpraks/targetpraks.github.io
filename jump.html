<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Maio Hub Jump</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#070b1a;color:#e6e9f5;font-family:-apple-system,'Inter',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.card{max-width:420px;padding:40px;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:20px;backdrop-filter:blur(12px)}
h1{font-size:18px;margin:0 0 6px}.muted{color:#8a93b5;font-size:13px;margin:0 0 24px}
a.btn{display:block;margin:10px 0;padding:14px 18px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px}
.oid{background:#7c5cff;color:#fff}.oin{background:rgba(255,255,255,.08);color:#e6e9f5;border:1px solid rgba(255,255,255,.15)}
.err{color:#ff7b7b;font-size:13px;display:none;margin-top:18px}
</style></head><body><div class="card">
<h1 id="t">Opening vault doc…</h1>
<p class="muted" id="s">Maio Hub · targetpraks.github.io</p>
<a id="obs" class="btn oid" href="#">Open in Obsidian</a>
<a id="ok" class="btn oin" href="#">Open in OpenKnowledge</a>
<p class="err" id="e">App didn't open? Ask the agents to regenerate this link.</p>
<script>
var p=new URLSearchParams(location.search);
var v=p.get('vault'),f=p.get('file'),d=p.get('doc')||f,title=p.get('t');
if(title){document.title='Maio Hub · '+title}
if(f){document.getElementById('t').textContent=f}
else if(d){document.getElementById('t').textContent=d}
var ou='obsidian://open?vault='+encodeURIComponent(v||'');
if(f){ou+='&file='+encodeURIComponent(f)}
var ku='openknowledge://open?doc='+encodeURIComponent(d||'');
if(v){ku+='&vault='+encodeURIComponent(v)}
document.getElementById('obs').href=ou;
document.getElementById('ok').href=ku;
setTimeout(function(){document.getElementById('e').style.display='block'},2500);
</script></div></body></html>
