<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maio OS — the household cockpit</title>
<meta name="description" content="Maio OS — the household cockpit: projects, agents, reports, PRDs, the live stack, the fleet kanban and this machine's vitals.">
<!-- v2 daylight: favicon + system-font kit. No Google Fonts — the light theme
     uses the OS stacks (Avenir Next / system-ui / ui-monospace) so the page
     makes zero external requests. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#F7F4EC">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080b12; --bg2:#0b0f18; --panel:#10151f; --panel2:#141a26; --line:#1e2836; --line2:#2a3648;
  --ink:#e8eaf2; --body:#b9c1d0; --dim:#7e8898; --dim2:#5a6375;
  --gold:#d4a853; --gold-dim:#8a6f36; --ok:#6fbf8b; --warn:#e0b34c; --bad:#e07a6a; --blue:#7ea6d4;
  --grot:'Space Grotesk',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.55;
     -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel2);border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dim)}

/* ============ BOOT ============ */
#boot{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;
      transition:opacity .45s ease;cursor:pointer}
#boot.gone{opacity:0;pointer-events:none}
.bootbox{width:min(560px,86vw)}
.bootlogo{font-family:var(--grot);font-weight:600;font-size:1.5rem;color:var(--ink);letter-spacing:-.01em}
.bootlogo em{font-style:normal;color:var(--gold)}
.bootsub{font-family:var(--mono);font-size:.75rem;color:var(--dim2);margin-top:2px}
#bootlog{font-family:var(--mono);font-size:.78rem;color:var(--dim);margin-top:22px;min-height:96px}
#bootlog div{opacity:0;animation:bline .3s forwards}
#bootlog .ok{color:var(--ok)} #bootlog .bad{color:var(--bad)} #bootlog .dim{color:var(--dim2)}
@keyframes bline{to{opacity:1}}
.bootskip{margin-top:18px;font-size:.72rem;color:var(--dim2)}

/* ============ DATA ERROR STATE ============ */
#dataerr{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;
         background:var(--bg);padding:22px;overflow:auto}
.errbox{width:min(640px,94vw);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);
        border-radius:14px;padding:24px 26px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.errlogo{font-family:var(--grot);font-weight:600;font-size:1.1rem;color:var(--ink);letter-spacing:-.01em}
.errlogo em{font-style:normal;color:var(--gold)}
.errbox h1{font-family:var(--grot);font-size:1.32rem;font-weight:600;color:var(--bad);margin:13px 0 11px;letter-spacing:-.01em}
.errbox p{font-size:.88rem;color:var(--body);margin-bottom:10px;max-width:64ch}
.errbox .errdetail{font-family:var(--mono);font-size:.74rem;color:var(--dim);word-break:break-word;
                   background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.errbox .errhint{font-size:.8rem;color:var(--dim2);margin-bottom:0}

/* ============ TOPBAR ============ */
/* Desktop keeps the exact 40px bar and no safe-area padding. On a phone the mobile block
   sets height = 48px + env(safe-area-inset-top) and padding-top = the same inset, so the
   border-box bottom edge is always 48 + inset and the 48px content area (and therefore the
   44x44 Search control) sits fully below the inset. Everything below the bar derives from
   that same 48 + inset value, so the geometry can never disagree. */
#topbar{position:fixed;top:0;left:0;right:0;height:40px;z-index:100;display:flex;align-items:center;gap:14px;
        padding:0 14px;background:rgba(8,11,18,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#logo{font-family:var(--grot);font-weight:600;font-size:.95rem;color:var(--ink);letter-spacing:-.01em;white-space:nowrap;flex:none}
#logo em{font-style:normal;color:var(--gold)}
.menubtn{font-size:.8rem;color:var(--dim);padding:3px 9px;border-radius:6px;white-space:nowrap}
.menubtn:hover{background:var(--panel2);color:var(--ink)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:.72rem;color:var(--dim2)}
#cmdbtn{display:flex;align-items:center;gap:7px;font-size:.76rem;color:var(--dim);border:1px solid var(--line2);
        padding:4px 10px;border-radius:7px;background:var(--panel)}
#cmdbtn:hover{color:var(--ink);border-color:var(--gold-dim)}
#clock{white-space:nowrap}
#genned{white-space:nowrap}
#genned.stale{color:var(--warn);font-weight:500}
#genned.fresh{color:var(--ok)}
#genned.unknown{color:var(--dim)}

/* ============ VITALS STRIP (mobile) ============ */
/* Shown only on phones, where the desklets are hidden. One line of live numbers built
   from the same values the desktop desklets show — same STACK counts, same snapshot age,
   same project/agent/report counts — so there is one source of truth for each figure.
   Hidden on desktop, so desktop rendering is untouched. */
#vitals{position:fixed;top:40px;left:0;right:0;height:34px;z-index:99;display:none;align-items:center;
        padding:0 12px;gap:10px;background:rgba(11,15,24,.92);backdrop-filter:blur(12px);
        border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.68rem;color:var(--dim2);
        white-space:nowrap;overflow:hidden}
#vitals .vsep{width:1px;height:14px;background:var(--line2);flex:none}
#vitals .vitem{flex:none;display:flex;align-items:center;gap:5px}
#vitals b{font-weight:500}
#vitals .vok{color:var(--ok)} #vitals .vwarn{color:var(--warn)} #vitals .vbad{color:var(--bad)}
#vitals .vink{color:var(--ink)} #vitals .vdim{color:var(--dim2)}
/* only the labels shrink and clip; the numbers never move, so a narrow phone drops
   words, not digits. Nothing here can push the strip past one line. */
#vitals .vcap{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
/* PR4 item 3 — the strip's counters are real controls. The strip keeps PR3's approved
   34px height and its single line; each counter is a button the full height of the strip
   and at least 44px wide, with a visible hover/active box. Nothing here changes the
   layout: the padding is cancelled by an equal negative margin, so every number stays on
   exactly the pixel PR3 put it on and the gap between two counters stays clear (a button's
   box reaches 6px into a 10px gap, leaving 9px between neighbouring counter boxes).
   A 44px-TALL target is not achievable in a 34px strip: the box would have to grow 10px,
   and above the strip sits the top bar (whose 44px-high Search control crosses that band)
   while below it sits the focused window (whose 44px close/min/max lights begin at the
   desktop's first pixel). The strip paints above both, so a taller counter would silently
   steal those taps. Measured overlap is in the PR body, with the one-line proposal. */
#vitals button.vitem{padding:0 6px;margin:0 -6px;border-radius:9px;min-width:44px;min-height:34px;justify-content:center}
#vitals button.vitem:hover{background:rgba(42,54,72,.55)}
#vitals button.vitem:active{background:rgba(42,54,72,.8)}

/* ============ DESKTOP / DESKLETS ============ */
#desktop{position:fixed;top:40px;left:0;right:0;bottom:var(--dock-clear,64px);overflow:hidden}
#skyrim{position:absolute;inset:0;pointer-events:none;opacity:.5}
/* #winlayer is the windows' container, not a surface. It is the last child of #desktop, so
   as a normal box it sits on top of the Desk's counters (#desklets-area comes earlier in the
   DOM) and swallows every click and tap meant for them — including on a phone, where a
   window is full-bleed across the whole desktop. With the layer transparent to pointers,
   only real windows take input: a point that is inside no window now reaches the counters.
   This is what makes PR4's clickable counters actually clickable rather than merely
   script-clickable; PR3's drag/resize/close (all inside a .win) are unaffected. */
#winlayer{pointer-events:none}
.win{pointer-events:auto}
.desklets{position:absolute;top:22px;left:22px;display:grid;gap:12px;grid-template-columns:repeat(2,minmax(210px,240px));max-width:calc(100% - 44px)}
.desklet{background:rgba(16,21,31,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:13px 15px;pointer-events:auto}
.desklet h4{font-family:var(--grot);font-size:.72rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-bottom:9px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:.8rem;
      width:100%;text-align:left}
.vrow .nm{color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.vrow .vl{font-family:var(--mono);font-size:.72rem}
/* PR4 item 3 — a household counter that opens its window: the whole row is the control, so
   it is reachable with the mouse anywhere along the row, by Enter/Space when focused, and
   by tap on a phone (the mobile block below gives it the 44px hit height). Only the rows
   that name a window become buttons; a plain row keeps the same look and is still a div. */
button.vrow{cursor:pointer;border-radius:7px}
button.vrow:hover{background:var(--panel)}
button.vrow:hover .nm{color:var(--ink)}
.pill{font-family:var(--mono);font-size:.66rem;padding:1px 7px;border-radius:20px;border:1px solid var(--line2)}
.pill.ok{color:var(--ok);border-color:rgba(111,191,139,.35)}
.pill.bad{color:var(--bad);border-color:rgba(224,122,106,.35)}
.pill.warn{color:var(--warn);border-color:rgba(224,179,76,.35)}
.bigstat{display:flex;gap:16px}
.bigstat .bs{flex:1}
/* PR4 item 3 — each stack-status counter is a button. Padding with an equal negative
   margin keeps the numbers exactly where PR3 drew them while widening the hit box. */
.bigstat button.bs{padding:2px 6px;margin:-2px -6px;border-radius:8px;text-align:left;cursor:pointer}
.bigstat button.bs:hover{background:rgba(42,54,72,.45)}
.bigstat b{display:block;font-family:var(--mono);font-size:1.35rem;font-weight:500;color:var(--ink);line-height:1.2}
.bigstat span{font-size:.68rem;color:var(--dim2);letter-spacing:.05em}
.bigstat b.gold{color:var(--gold)} .bigstat b.bad{color:var(--bad)}
.bigstat b.ok{color:var(--ok)} .bigstat b.warn{color:var(--warn)}

/* ============ DOCK ============ */
/* Design choice (PR3): the dock always SCROLLS inside itself once the buttons cannot all
   fit, rather than squeezing labels or dropping buttons.
   - Why: PR1 fixed the full, untruncated labels ("The Desk", "About / Roadmap"), so the
     buttons have a real minimum width; at 360-430px eight of them cannot fit at 44x44 even
     with zero padding. Scrolling keeps every label whole and every hit area >= 44x44
     (item 4), which squeezing would not.
   - Affordance: (a) an edge fade on the side that still has hidden buttons — the dock is
     masked only on that side, driven by --dock-fade-l / --dock-fade-r; (b) a track+thumb
     bar under the dock (#scroller) that appears only while the dock overflows. Both cues
     disappear when there is nothing more to scroll (and entirely at 1440px, where nothing
     overflows), so desktop is unchanged.
   - The dock is centred with left:50% + translateX(-50%) so it stays centred when it fits
     and when it scrolls. */
#dock{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:6px;align-items:center;
      max-width:calc(100vw - 20px);overflow-x:auto;overflow-y:hidden;background:rgba(16,21,31,.85);backdrop-filter:blur(14px);border:1px solid var(--line2);
      border-radius:16px;padding:7px;
      -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--dock-fade-l,0px),#000 calc(100% - var(--dock-fade-r,0px)),transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0,#000 var(--dock-fade-l,0px),#000 calc(100% - var(--dock-fade-r,0px)),transparent 100%)}
.dockbtn{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;min-height:44px;padding:8px 10px;border-radius:11px;
         color:var(--dim);font-size:.66rem;letter-spacing:.02em;transition:background .15s,color .15s;flex:none}
.dockbtn span{white-space:nowrap}
.dockbtn:hover{background:var(--panel2);color:var(--ink)}
.dockbtn .di{font-size:1.05rem}
.dockbtn.active{color:var(--gold)}
.dockbtn .dot{width:4px;height:4px;border-radius:50%;background:transparent}
.dockbtn.open .dot{background:var(--gold)}
.docksep{width:1px;height:34px;background:var(--line2);margin:0 4px;flex:none}

/* ============ SCROLL HINT (dock overflow indicator) ============ */
/* A track under the dock with a distinctly coloured thumb: the thumb's width is the visible
   fraction of the dock and its offset tracks scrollLeft from the start of the track to the
   end. The bar is never transformed, so JS sets its `left` as a viewport coordinate and the
   whole cue stays inside the viewport; it is shown only while the dock overflows (the .show
   class is set in JS) and is aria-hidden, since the dock itself is the control. */
#scroller{position:fixed;bottom:calc(1px + var(--sab,0px));z-index:100;height:4px;display:none;border-radius:2px;
          background:rgba(42,54,72,.85);overflow:hidden;pointer-events:none}
#scroller.show{display:block}
#scroller i{position:absolute;top:0;left:0;height:100%;border-radius:2px;background:var(--gold)}

/* ============ WINDOWS ============ */
.win{position:absolute;min-width:320px;min-height:220px;background:var(--bg2);border:1px solid var(--line2);border-radius:13px;
     box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.win.focused{border-color:#3a4a66;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(212,168,83,.14)}
.win.max{border-radius:0;left:0!important;top:0!important;width:100%!important;height:100%!important}
.winbar{display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);
        cursor:move;user-select:none;flex:none}
.wlights{display:flex;gap:6px}
.wl{width:11px;height:11px;border-radius:50%;background:var(--line2);cursor:pointer}
.wl.wclose:hover{background:var(--bad)} .wl.wmin:hover{background:var(--warn)} .wl.wmax:hover{background:var(--ok)}
.wtitle{font-family:var(--grot);font-size:.8rem;font-weight:500;color:var(--ink);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsub{font-family:var(--mono);font-size:.66rem;color:var(--dim2);margin-left:auto;white-space:nowrap}
.winbody{flex:1;overflow:auto;padding:16px 18px}
.winresize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;
           background:linear-gradient(135deg,transparent 50%,var(--line2) 50%)}

/* window content bits */
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:.75rem;color:var(--dim);border:1px solid var(--line2);padding:3px 12px;border-radius:20px}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(212,168,83,.07)}
.searchbox{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--ink);
           font:inherit;font-size:.85rem;padding:8px 12px;margin-bottom:14px}
.searchbox::placeholder{color:var(--dim2)}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;
       transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.pcard .pn{font-family:var(--grot);font-weight:500;color:var(--ink);font-size:.9rem;display:flex;align-items:center;gap:8px}
.pcard .pw{font-size:.76rem;color:var(--dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pm{display:flex;gap:8px;align-items:center;margin-top:9px;font-family:var(--mono);font-size:.66rem;color:var(--dim2)}
.pcard .fam{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--panel2);color:var(--dim)}
.fam.dev{color:var(--blue)} .fam.work{color:var(--gold)} .fam.pages{color:var(--ok)} .fam.venture{color:#c9a0e8}
.tagprd{color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:0 5px;font-size:.6rem}
.rows{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;font-size:.8rem;border-bottom:1px solid rgba(30,40,54,.55)}
.rrow:hover{background:var(--panel)}
.rrow .ra{font-family:var(--grot);color:var(--ink);min-width:86px}
.rrow .rp{flex:1;min-width:0;color:var(--dim);font-family:var(--mono);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rd{font-family:var(--mono);font-size:.7rem;color:var(--dim2);white-space:nowrap}
.copy{font-family:var(--mono);font-size:.62rem;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:1px 7px;flex:none}
.copy:hover{color:var(--gold);border-color:var(--gold-dim)}
.svcgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.svc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.svc .sn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.svc .sn b{font-family:var(--grot);font-weight:500;font-size:.84rem;color:var(--ink)}
.svc .sp{font-family:var(--mono);font-size:.68rem;color:var(--dim2);margin-top:4px}
.svc .snote{font-size:.68rem;color:var(--dim2);margin-top:6px}
.agentgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
/* PR4 item 4 — an agent card is a real control that opens the agent's detail window.
   Cards are block-level in a grid, so a taller card pushes the row down instead of
   overlapping its neighbour (the same rule PR3 used for .pcard/.rrow). */
.agc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
     cursor:pointer;transition:border-color .15s,transform .15s;text-align:left}
.agc:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.agc:hover .an{color:var(--gold)}
.agc .an{font-family:var(--grot);font-weight:500;color:var(--ink);font-size:.85rem}
.agc .ar{font-size:.7rem;color:var(--dim);margin-top:3px;min-height:2.1em}
.agc .al{font-family:var(--mono);font-size:.64rem;color:var(--dim2);margin-top:6px}
.agc .al b{color:var(--gold);font-weight:500}
.adev{display:flex;gap:12px;align-items:flex-start}
.aglyph{font-size:1.15rem;flex:none;line-height:1.2}
.empty{color:var(--dim2);font-size:.8rem;padding:22px;text-align:center}
/* PR4 item 5 — a stack URL is a real link under PR2's allow-list, so the ones that are
   not allowed through (or missing) stay plain text. These are localhost / LAN addresses
   that only resolve on Ricardo's own network; that is expected and nothing is added. */
.svcurl{display:inline-block;word-break:break-all;max-width:100%}
.sect{font-family:var(--grot);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:18px 0 9px}
.sect:first-child{margin-top:2px}
.notebox{background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.25);border-radius:10px;padding:11px 14px;font-size:.78rem;color:var(--body)}
.notebox b{color:var(--gold)}
.notebox.warnbox{background:rgba(224,179,76,.10);border-color:rgba(224,179,76,.42)}
.notebox.warnbox b{color:var(--warn)}
.aboutp{font-size:.84rem;color:var(--body);max-width:70ch;margin-bottom:11px}
.aboutp b{color:var(--ink)}
.phases{display:grid;gap:10px;margin-top:6px}
.phase{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.phase .pn2{font-family:var(--mono);color:var(--gold);font-size:.75rem;flex:none;padding-top:2px}
.phase .pt{font-size:.82rem;color:var(--ink);font-weight:500}
.phase .pd{font-size:.76rem;color:var(--dim);margin-top:2px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dname{font-family:var(--grot);font-weight:600;font-size:1.05rem;color:var(--ink);letter-spacing:-.01em}
.drows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{display:flex;gap:14px;padding:9px 2px;border-bottom:1px solid rgba(30,40,54,.55);font-size:.82rem}
.dk{flex:none;width:92px;font-family:var(--mono);font-size:.66rem;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.dv{flex:1;min-width:0;color:var(--body);word-break:break-word}
.dv code{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.dfoot{margin-top:14px}

/* ============ COMMAND BAR ============ */
#cmdbar-wrap{position:fixed;inset:0;z-index:500;display:none;align-items:flex-start;justify-content:center;padding-top:16vh;
             background:rgba(5,7,12,.6);backdrop-filter:blur(3px)}
#cmdbar-wrap.show{display:flex}
#cmdbar{width:min(620px,92vw);background:var(--bg2);border:1px solid var(--line2);border-radius:13px;overflow:hidden;

<script>
/* Boot guard — must run BEFORE the data.js request is issued.

   A synchronous <script src="data.js"> blocks the parser, so if that request is slow or
   never answered, nothing after it runs: no watchdog, no click-to-skip, no failure state.
   The boot screen would stay up for good. So the protection lives here, ahead of the
   request: a self-contained inline script with its own timeout. It is removed as soon as
   the shell script below has installed its own boot handlers. */
(function(){
  var boot = document && document.getElementById ? document.getElementById('boot') : null;
  /* ONE owner of the ready/failed decision, shared by this guard and the shell below.
     'loading' → nothing decided yet; 'ready' → valid data + shell started; 'failed' → error.
     A timer may only ever move loading → failed. Once ready, nothing may regress it. */
  window.__maioState = 'loading';
  function dataPresent(){
    var d = window.MAIO_DATA;   // set by data.js, whenever it arrived
    return d !== null && typeof d === 'object' && !Array.isArray(d);
  }
  function paintFail(detail){
    if(window.__maioState === 'ready') return;        // never replace a healthy cockpit
    boot.remove();
    /* hide the cockpit, and empty+hide the vitals status region so a stale "stack 0 0 0"
       is never announced behind the error overlay (the shell restores it on recovery) */
    ['desktop','dock','menunav'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display='none'; });
    var vsc = document.getElementById('scroller'); if(vsc) vsc.style.display = 'none';
    var v = document.getElementById('vitals');
    if(v){ v.style.display = 'none'; v.textContent = ''; v.removeAttribute('aria-label'); }
    var e = document.getElementById('dataerr');
    if(!e){
      e = document.createElement('div'); e.id = 'dataerr'; e.setAttribute('role','alert');
      e.innerHTML = '<div class="errbox">' +
        '<div class="errlogo">maio<em>.</em>os</div>' +
        '<h1>Data could not be loaded</h1>' +
        '<p>This cockpit needs <b>maio-os/data.js</b> to show anything real. When the page loaded, that file was missing, unreadable, or did not answer — so there is nothing to display.</p>' +
        '<p>This is not an empty cockpit and the household has not disappeared — the snapshot simply did not arrive.</p>' +
        '<p class="errdetail" id="dataerr-detail"></p>' +
        '<p class="errhint">data.js is generated by a script that is not part of this repository. Regenerate it, then reload this page.</p>' +
        '</div>';
      document.body.appendChild(e);
    }
    var dd = document.getElementById('dataerr-detail');
    if(dd) dd.textContent = detail || 'Timed out waiting for maio-os/data.js.';
    window.__maioDataFail = true;
    window.__maioState = 'failed';
  }
  var t = setTimeout(function(){
    /* Re-check REAL state before failing — the timer must never mistake a slow-but-healthy
       load for a failure. A decision already made wins; and if the data actually arrived
       (even while the main thread was busy), this is not a data failure. */
    if(window.__maioState !== 'loading') return;
    if(dataPresent()) return;
    paintFail('Timed out waiting for maio-os/data.js.');
  }, 7000);
  window.__maioBootGuard = function(){ clearTimeout(t); };
  /* If the shell script itself throws before it finishes (whatever the cause), the page
     must still explain itself rather than sit on a boot screen. */
  window.addEventListener('error', function(ev){
    if(window.__maioState !== 'loading' || window.__maioShellDone) return;
    paintFail('The cockpit failed to start: ' + ((ev && ev.message) ? ev.message : 'unknown error'));
  });
  /* clicking the boot screen still skips it even while data.js is still in flight */
  if(boot) boot.addEventListener('click', function(){ if(boot.isConnected) boot.classList.add('gone'); });
})();
</script>

   Safety + honesty layer (PR2):

     obvious error state instead of a healthy-looking empty cockpit; the boot screen
     also has a watchdog so it can never hang forever

const MONTH_LEN = [31,28,31,30,31,30,31,31,30,31,30,31];
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
function epochDay(y, mo, day){                       // day number, valid for any year (incl. 1582 and earlier)
  let d = day; for(let m=1; m<mo; m++) d += MONTH_LEN[m-1] + (m===2 && isLeap(y) ? 1 : 0);
  const py = y - 1;
  return py*365 + Math.floor(py/4) - Math.floor(py/100) + Math.floor(py/400) + d; }
function dayDiff(ds){                                 // signed calendar days: + = past, 0 = today, - = future
  const d = nDate(ds); if(!d) return null;
  const now = new Date();
  const snap  = epochDay(+d.slice(0,4), +d.slice(5,7), +d.slice(8,10));
  const today = epochDay(now.getFullYear(), now.getMonth()+1, now.getDate());
  return today - snap; }
function agoTxt(ds){ const n=dayDiff(ds); if(n===null) return 'age unknown';
  if(n<0) return 'in the future';
  if(n===0) return 'today'; if(n===1) return 'yesterday'; if(n<30) return n+'d ago';
  if(n<365) return Math.round(n/30)+'mo ago'; return Math.round(n/365)+'y ago'; }
/* snapshot age: signed local calendar days, or null when the date is unusable */
function ageDays(ds){ const n=dayDiff(ds); return n===null ? null : n; }
function ageText(ds){ const n=ageDays(ds); if(n===null) return 'snapshot age unknown';
  if(n<0) return 'snapshot dated in the future';
  if(n===0) return 'today'; if(n===1) return '1 day old'; return n+' days old'; }

/* ---------- data: read, validate, normalise ---------- */
const RAW = (typeof window!=='undefined') ? window.MAIO_DATA : undefined;
const DATA_OK = isObj(RAW);
const D = DATA_OK ? RAW : {};
/* each normaliser reads only via the type-checked helpers above, and returns null if a
   hostile field (throwing getter etc.) still escapes them; the caller drops nulls. */
function normStack(s){
  return {name:str(s.name)||'unnamed service', port:str(s.port), url:str(s.url), note:str(s.note),
          ok:s.ok===true, code:num(s.code,null), ms:num(s.ms,null)}; }
function normDev(d){
  return {name:str(d.name)||'unnamed host', url:str(d.url), ok:d.ok===true, code:num(d.code,null)}; }
function normArtifact(a){ if(!isObj(a)) return null;
  return {path:str(a.path), date:nDate(a.date), ext:str(a.ext), kb:num(a.kb,null)}; }
function normPrdNewest(v){ if(isObj(v)) return {path:str(v.path), date:nDate(v.date)};
  return typeof v==='string' ? {path:'', date:nDate(v)} : null; }
function normProject(p){ return {name:str(p.name)||'untitled project', family:str(p.family),
  famKey:tidy(p.family)||'project', root:str(p.root), what:str(p.what), lastTouched:nDate(p.lastTouched),
  hasPRD:p.hasPRD===true, prdNewest:one(()=>normPrdNewest(p.prdNewest), null), artifact:one(()=>normArtifact(p.artifact), null),
  priority:str(p.priority), status:str(p.status)}; }
function normReport(r){ return {agent:str(r.agent)||'unknown', path:str(r.path), date:nDate(r.date),
  ext:str(r.ext), kb:num(r.kb,null)}; }
function normAgent(a){ const l = one(()=> isObj(a.latest) ? {path:str(a.latest.path), date:nDate(a.latest.date)} : null, null);
  return {name:str(a.name)||'unnamed agent', role:str(a.role), latest:l}; }
function normPRD(p){ return {title:str(p.title)||'(untitled)', project:str(p.project), path:str(p.path),
  date:nDate(p.date), area:str(p.area)}; }
/* any record whose normaliser throws is dropped; a throw costs only that record.
   The section itself is read lazily and inside one(), so a throwing section getter
   degrades to an empty list rather than taking the shell down. */
const normAll = (getSection, fn) => one(()=> objects(getSection()).map(x => one(()=>fn(x), null)).filter(Boolean), []);

const DATA = {
  meta: one(()=> isObj(D.meta) ? D.meta : {}, {}),
  stack: normAll(()=>D.stack, normStack),
  devServers: normAll(()=>D.devServers, normDev),
  projects: normAll(()=>D.projects, normProject),
  reports: normAll(()=>D.reports, normReport),
  roster: normAll(()=>D.roster, normAgent),
  prds: normAll(()=>D.prds, normPRD),
  summary: one(()=> isObj(D.summary) ? D.summary : {}, {}),
  library: one(()=> isObj(D.library) ? D.library : {}, {}),
  devServersStaleSince: one(()=>str(D.devServersStaleSince), ''),
  enriched: one(()=> isObj(D.enriched) ? D.enriched : {}, {}),
};
const S = DATA.summary;
/* summary counts are read defensively too: a summary with a throwing getter still yields a number */
function snum(key, fallback){ return one(()=>num(S[key], fallback), fallback); }

/* three-state service health: ok+2xx green, ok+non-2xx (or no code) amber, else red */
function svcState(s){ if(s.ok!==true) return 'bad'; const c=s.code;
  return (c!=null && c>=200 && c<300) ? 'ok' : 'warn'; }
const STACK = (()=>{ let ok=0,warn=0,bad=0;
  DATA.stack.forEach(s=>{ const st=svcState(s); if(st==='ok') ok++; else if(st==='warn') warn++; else bad++; });
  return {ok, warn, bad, total:DATA.stack.length}; })();

const SNAP_RAW = one(()=>str(DATA.meta.generatedAt), '');
const SNAP_AGE = one(()=>ageDays(SNAP_RAW), null);
const SNAP_STALE = SNAP_AGE!==null && SNAP_AGE>1;
/* dev-server counts: read once and reused by the desklets, the boot log and the phone
   vitals strip, so all three can only ever agree. */
const DEV_ON = snum('devOnline',0), DEV_TOTAL = snum('devTotal', DATA.devServers.length);

/* renderers are wrapped so one bad view degrades to a message instead of a blank window */
function safeHtml(fn, fallback){
  try{ const h=fn(); return (typeof h==='string') ? h : (fallback||''); }
  catch(_){ return fallback || '<div class="empty">this view could not be rendered</div>'; }
}

const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- state ---------- */
const OPEN = new Map();      // id -> {el, prev, mode, geo}
let zIndex = 10; let focusedId = null;
let RESTORING = false;       // true only while restoreLayout() is repopulating OPEN
let DATA_READY = false;      // shell finished starting against a valid snapshot
/* PR4: true only while a deep link (first load or hashchange) is being applied. Following a
   link is a VIEW request, not a layout edit, so persist() is suppressed for its duration.
   That is what keeps a phone link from overwriting a desktop-saved layout, and it is why the
   acceptance rule is "storage byte-identical after following a link with no other
   interaction": the next real interaction (open, drag, resize, min/max, close) writes the
   live set — now including the linked window — as usual. */
let LINKING = false;
/* PR4 item 4: the one reusable detail window shows either a project or an agent; these two
   are mutually exclusive owners of it (openDetail/openAgent clear the other). */
let detailAgent = null;
const MOBILE = matchMedia('(max-width:760px)').matches;
/* layout restored on load: [{id,left,top,width,height,max}].
   Called from the bottom of the script — openWin touches the const WINS/_WINS state,
   so restoring any earlier hits a TDZ ReferenceError (silently swallowed before). */
function restoreLayout(){
  /* While this runs, persist() is suppressed: each openWin() would otherwise rewrite
     storage from the partially-populated OPEN, dropping entries that have not been
     restored yet — and the next entry then loses its saved geometry/max state. */
  RESTORING = true;
  try{ const saved = JSON.parse(localStorage.getItem('maioos.layout')||'[]');
    if(!Array.isArray(saved)) return;
    /* mobile windows are CSS-forced full-screen: restore which ones were open, skip the geometry */
    saved.forEach(o=>{
      if(!o || typeof o.id!=='string') return;
      if(o.id==='detail'){
        /* PR4 item 4: an agent detail saved on reload is rebuilt here. It is only ever
           rebuilt as the agent view: the saved entry names an agent, and openAgent is the
           only path that would set that name, so the two can never disagree. */
        if(typeof o.agent==='string'){
          const a=DATA.roster.find(x=>x.name===o.agent);
          if(a){ openAgent(a, MOBILE ? null : o); return; }   // agent gone from data.js → skip silently
        }
        const p=DATA.projects.find(x=>x.name===o.project);
        if(p) openDetail(p, MOBILE ? null : o);        // project gone from data.js → skip silently
        return;
      }
      const d=winDef(o.id);                            // own property + a render function, or nothing
      if(d && !d.hidden) openWin(o.id, MOBILE ? null : o);
    });
  }catch(_){} finally { RESTORING = false; }
}

/* ---------- boot sequence ---------- */
const bootEl = $('#boot'), bootLog = $('#bootlog');
let bootTimer = null, BOOT_WATCHDOG = null, bootStarted = false;
function startBoot(){
  bootStarted = true;
  if(!bootLog) return;
  const devOn = DEV_ON, devTotal = DEV_TOTAL;
  const lines = [
    ['dim','maio.os 2.2 · daylight build'],
    ['ok',`stack probe ......... ${STACK.ok}/${STACK.total} clean · ${STACK.warn} non-2xx · ${STACK.bad} down`],
    [devOn? 'ok':'bad',`dev servers ......... ${devOn}/${devTotal} online`],
    ['ok',`projects indexed .... ${snum("projects", DATA.projects.length)}`],
    ['ok',`agent reports ....... ${snum("reports", DATA.reports.length)} · PRDs ${snum("prds", DATA.prds.length)}`],
    [SNAP_STALE?'bad':'dim',`snapshot ${ageText(SNAP_RAW)} · click / any key to enter`],
  ];
  let i = 0;
  bootTimer = setInterval(()=>{
    if(i >= lines.length){ clearInterval(bootTimer); bootTimer=null; setTimeout(endBoot, 520); return; }
    const [cls, txt] = lines[i++]; const div = document.createElement('div');
    div.className = cls; div.textContent = '▸ ' + txt; bootLog.appendChild(div);
  }, 240);
}
function endBoot(){
  if(bootTimer){ clearInterval(bootTimer); bootTimer=null; }
  if(BOOT_WATCHDOG){ clearTimeout(BOOT_WATCHDOG); BOOT_WATCHDOG=null; }
  if(bootEl && bootEl.isConnected){ bootEl.classList.add('gone');
    setTimeout(()=>{ if(bootEl && bootEl.isConnected) bootEl.remove(); }, 600); }
}
/* ---------- the single owner of the ready / failed transition ----------
   Every route that decides whether this page is healthy or broken goes through here,
   so no late timer can ever contradict a load that actually succeeded.

   - 'ready'  : valid data and the shell is up. It is TERMINAL — once set, no timer may
                declare a data failure, hide the cockpit, or flip DATA_READY back.
   - 'failed' : genuinely no usable snapshot. Also terminal, so a recovered page is only
                brought back by markReady() (late recovery), never silently.
   - 'loading': nothing decided yet; a timer is allowed to fail into 'failed'. */
let uiState = 'loading';
function markReady(){
  uiState = 'ready';
  DATA_READY = true;
  window.__maioState = 'ready';
  /* If a pre-data.js guard already painted the failure state (a genuinely slow load),
     undo it — remove the error node AND un-hide the cockpit it hid: the cockpit is the
     truth now. This is the late-recovery path; a healthy load has nothing to undo. */
  ensureCockpitVisible();
  armGuard();          // healthy shell → Back now closes a window first (see armGuard)
}
function markFailed(detail){
  if(uiState === 'ready') return;    // a health-cocked page is never failed by a timer
  uiState = 'failed';
  showDataError(detail);
}
/* un-hide the cockpit after any failure paint — used on BFCache restore. Never creates
   an error node and never changes the ready/failed decision. */
function ensureCockpitVisible(){
  ['desktop','dock','menunav','vitals'].forEach(id => {
    const el = document.getElementById(id);
    if(el && el.style.display === 'none') el.style.display = '';
  });
  const sc = document.getElementById('scroller'); if(sc) sc.style.display = '';
  if(window.__maioDataFail){
    const e = document.getElementById('dataerr'); if(e) e.remove();
    window.__maioDataFail = false;
    /* the failure state cleared the vitals strip; repaint it now that data is real again */
    one(renderVitals, null);
  }
}
/* plain-language failure state — never a healthy-looking empty cockpit */
function showDataError(detail){
  if(uiState === 'ready') return;
  DATA_READY = false;
  window.__maioDataFail = true;
  window.__maioState = 'failed';
  if(bootTimer){ clearInterval(bootTimer); bootTimer=null; }
  if(BOOT_WATCHDOG){ clearTimeout(BOOT_WATCHDOG); BOOT_WATCHDOG=null; }
  try{
    const b=$('#boot'); if(b && b.isConnected) b.remove();   // no fade: the failure must read immediately
    const hide = el => { if(el) el.style.display='none'; };
    hide($('#desktop')); hide($('#dock')); hide($('#menunav')); hide($('#cmdbar-wrap')); hide($('#scroller'));
    /* The vitals strip is a role="status" region: leaving it in the DOM behind the error
       overlay would announce healthy-looking zeros ("stack 0 0 0"). Hide it AND empty it,
       so it is neither visible nor in the accessibility tree. markReady() puts it back. */
    const v = $('#vitals');
    if(v){ v.style.display = 'none'; v.textContent = ''; v.removeAttribute('aria-label'); }
    let e = $('#dataerr');
    if(!e){ e=document.createElement('div'); e.id='dataerr'; e.setAttribute('role','alert'); document.body.appendChild(e); }
    e.innerHTML =
      '<div class="errbox">'+
        '<div class="errlogo">maio<em>.</em>os</div>'+
        '<h1>Data could not be loaded</h1>'+
        '<p>This cockpit needs <b>maio-os/data.js</b> to show anything real. When the page loaded, that file was missing, unreadable, or did not contain a data object — so there is nothing to display.</p>'+
        '<p>This is not an empty cockpit and the household has not disappeared — the snapshot simply did not arrive.</p>'+
        '<p class="errdetail" id="dataerr-detail"></p>'+
        '<p class="errhint">data.js is generated by a script that is not part of this repository. Regenerate it, then reload this page.</p>'+
      '</div>';
    const dd = $('#dataerr-detail'); if(dd) dd.textContent = str(detail);
  }catch(_){ /* nothing left to fail into */ }
}
if(bootEl){
  bootEl.addEventListener('click', endBoot);
  addEventListener('keydown', () => { if(bootEl.isConnected) endBoot(); });
}
/* Boot protection, installed BEFORE the shell asks whether data arrived, so it covers a
   data.js that never loads, that is slow, that is not an object, or that throws
   mid-normalisation. The timeout decision is based on REAL state — is the shell ready,
   did valid data arrive — never on whether the boot element is still on screen: a
   finished (or merely unfinished) boot animation is not a failed load.

   - ready, or data already here → the load is fine; END BOOT so the cockpit can never be
     blocked by the screen, and never an error over a healthy page.
   - otherwise → the data genuinely did not arrive: show the failure state. */
BOOT_WATCHDOG = setTimeout(()=>{
  if(uiState === 'ready' || DATA_OK){ endBoot(); return; }   // reveal the working cockpit
  markFailed('Timed out waiting for maio-os/data.js.');
}, 7000);

/* ============ v2 daylight: local layer + Machine & Kanban windows ============
   local.js is written by the local server (127.0.0.1:9111) that runs on the
   machine; on the public GitHub Pages build it simply isn't there and every
   local panel degrades to the generator snapshot / an honest "open the local
   build" note. Nothing here touches the MAIO_DATA contract or the shell. */
const LS = v => str(v);                    // local strings pass through str() first
const LOCAL_SRC = './local.js';
let LOCAL = null;                          // last good MAIO_LOCAL payload
let LOCAL_STATUS = 'loading';              // loading | live | offline | absent
let LOCAL_TS = 0;
function LOCAL_REFRESH(){
  if(LOCAL_REFRESH._busy) return Promise.resolve(LOCAL);
  LOCAL_REFRESH._busy = true;
  return new Promise(resolve => {
    const s = document.createElement('script');
    const done = ok => {
      s.remove();
      if(ok && isObj(window.MAIO_LOCAL)){ LOCAL = window.MAIO_LOCAL; LOCAL_STATUS = 'live'; }
      else { LOCAL_STATUS = LOCAL ? 'offline' : 'absent'; }   // keep last good data, flag the miss
      LOCAL_TS = Date.now(); LOCAL_REFRESH._busy = false;
      one(renderGen, null);
      ['machine','kanban','reports'].forEach(id => { const w=OPEN.get(id); if(w && w.rerender) w.rerender(true); });
      resolve(LOCAL);
    };
    s.src = LOCAL_SRC + '?t=' + Math.floor(Date.now()/1000);
    s.onload = () => done(true);
    s.onerror = () => done(false);
    setTimeout(()=>{ if(LOCAL_REFRESH._busy) done(false); }, 6000);
    document.head.appendChild(s);
  });
}
LOCAL_REFRESH();
setInterval(LOCAL_REFRESH, 30000);
addEventListener('focus', () => { if(Date.now()-LOCAL_TS > 25000) LOCAL_REFRESH(); });
const LSEC = k => { const v = LOCAL && one(()=>LOCAL[k], null); return isObj(v) ? v : null; };
function localBadge(){
  if(LOCAL_STATUS==='live')   return `<span class="lbadge live">local · live</span>`;
  if(LOCAL_STATUS==='offline') return `<span class="lbadge err">local · unreachable</span>`;
  if(LOCAL_STATUS==='loading') return `<span class="lbadge">local · checking…</span>`;
  return `<span class="lbadge off">snapshot build — open the local server for live</span>`;
}
const fmtMoney = v => { const n=num(v,null); return n==null ? '—' : '$'+(n<100? n.toFixed(2) : Math.round(n).toLocaleString('en-US')); };
const fmtGb = v => { const n=num(v,null); return n==null ? '—' : (n>=10 ? n.toFixed(1) : n.toFixed(2)) + ' GB'; };
/* Long process names (com.apple.Virtualization.VirtualMachine) cannot wrap cleanly
   inside the memory chip — shorten to head…tail so both ends stay identifiable. */
const bigName = s => { s = str(s); return s.length <= 26 ? s : s.slice(0,15) + '…' + s.slice(-9); };
function agoTxt2(t){ const s=str(t); if(!s) return ''; const d=new Date(s); if(isNaN(d)) return ''; const mins=Math.floor((Date.now()-d)/60000);
  if(mins<2) return 'just now'; if(mins<60) return mins+' min ago';
  const h=Math.floor(mins/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago'; }

/* ---------- Machine window (local-only) ---------- */
function machineRamCard(L){
  const ram = LSEC('ram'); const slow = LSEC('slow');
  if(!ram) return `<div class="mcard"><h5>Memory</h5><div class="empty">live RAM needs the local server (127.0.0.1:9111)</div></div>`;
  const pct = num(ram.usedPct, 0);
  const cls = slow && slow.level==='HIGH' ? 'bad' : (pct>=75 ? 'warn' : '');
  const top = Array.isArray(ram.top) ? ram.top.slice(0,6) : [];
  return `<div class="mcard"><h5>Memory · ${esc(fmtGb(ram.usedPct!=null? (num(ram.totalGb,0)*num(ram.usedPct,0)/100) : null))} of ${esc(fmtGb(ram.totalGb))} used</h5>
    <div class="mgauge ${cls}"><i style="width:${clamp(pct,0,100).toFixed(1)}%"></i></div>
    <div class="mkv"><span>used</span><b>${esc(pct.toFixed(1))}%</b></div>
    <div class="mkv"><span>swap</span><b>${esc(fmtGb(ram.swapUsedGb))} / ${esc(fmtGb(ram.swapTotalGb))}</b></div>
    <div class="mkv"><span>pressure free</span><b>${esc(String(num(ram.pressureFreePct,'—')))}%</b></div>
    ${slow?`<div class="mnote"><span class="slowchip ${slow.level==='HIGH'?'hi':''}">${slow.level==='HIGH'?'⚠ slow machine':'✓ OK'} — ${esc(LS(slow.why))}${slow.biggest?` · biggest: <b>${esc(bigName(LS(slow.biggest.name)))}</b> ${esc(fmtGb(slow.biggest.sizeGb))}`:''}</span></div>`:''}
    <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn danger" id="trimbtn" aria-label="Unload local Ollama models to trim memory">⚡ Trim RAM</button>
      <button class="btn ghost" id="ramrefresh" aria-label="Refresh local readings">↻ Refresh</button>
    </div>
    <div id="fixout" class="mnote" aria-live="polite">${FIX_MSG}</div>
    <div class="sect" style="margin:12px 0 4px">Top processes</div>
    ${top.map(t=>`<div class="mkv"><span>${esc(LS(t.name))}</span><b>${esc(fmtGb(t.rssGb))} · ${esc(String(t.pctOfUsed))}%</b></div>`).join('') || '<div class="empty">no readings</div>'}
  </div>`;
}

function machineSessionsCard(){
  const se = LSEC('sessions'); const sp = LSEC('spend');
  if(!se && !sp) return `<div class="mcard"><h5>Sessions &amp; spend</h5><div class="empty">live sessions need the local server</div></div>`;

/* Where the fix action lives: same-origin when the page IS the local build (9111 or
   through the tailnet proxy); otherwise the loopback address, which the server accepts
   only when the request's Origin matches its allow-list — so the public Pages copy can
   never fire a fix. */
const FIX_URL = (() => {
  try{ const h=location.hostname, p=location.port;
    if(location.protocol.indexOf('http')===0 && (p==='9111' || h.endsWith('.ts.net'))) return '/api/fix'; }catch(_){}
  return 'http://127.0.0.1:9111/api/fix';
})();
/* Last action message, kept outside the DOM: window rerenders (every 30 s, and
   after each action) rebuild the cards, so a plain assignment to #fixout would
   vanish within seconds. fixSay() updates both the store and the live node. */
let FIX_MSG = '';
const fixSay = html => { FIX_MSG = String(html); const o = $('#fixout'); if(o) o.innerHTML = FIX_MSG; };
async function runFix(action, confirmLabel){
  const btn = $('#trimbtn');
  if(!$('#fixout')) return;
  if(btn && btn.dataset.armed !== '1'){
    btn.dataset.armed = '1'; const t0 = btn.textContent;
    btn.textContent = '⚠ ' + (confirmLabel || 'Confirm?') + ' — click again';
    fixSay('This unloads local Ollama models to free memory. They reload automatically on next use.');
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent = t0; } }, 4500);
    return;
  }
  if(btn){ btn.dataset.armed='0'; btn.disabled = true; }
  fixSay('working — unloading…');
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, confirm: true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      const freed = num(f.freedGb, 0);
      const un = Array.isArray(f.unloaded) ? f.unloaded : [];
      fixSay((freed >= 0.05 || un.length)
        ? `<b style="color:var(--ok)">✓ trimmed</b> — memory ${esc(String(f.beforeUsedPct))}% → ${esc(String(f.afterUsedPct))}%, freed <b>${esc(fmtGb(freed))}</b>` +
          (un.length ? ` · unloaded ${un.map(x=>esc(LS(x))).join(', ')}` : '')
        : `<b style="color:var(--ok)">✓ nothing to unload</b> — no Ollama models were loaded (memory stays at ${esc(String(f.beforeUsedPct))}%).`);
    } else {
      fixSay(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'fix failed')}</b>` + (j.error==='busy'?' — another fix is already running, try again in a few seconds.':''));
    }
  }catch(e){ fixSay(`<b style="color:var(--bad)">✗ unreachable</b> — the local server answered the page but not the action. Is it still running on 9111?`); }
  if(btn){ btn.disabled = false; btn.textContent = '⚡ Trim RAM'; }
  LOCAL_REFRESH();
}
/* Per-model actions from the Local models card: Unload (data-stop) / Warm (data-warm).
   Two-click confirm on the row button itself; output goes to the RAM card's #fixout. */
async function runModelFix(btn, action, model){
  const out = $('#fixout');
  const say = html => { FIX_MSG = String(html); if(out) out.innerHTML = FIX_MSG; };
  if(btn.dataset.armed !== '1'){
    // remember the pristine label once, so it can be restored after the action
    if(!btn.dataset.lbl) btn.dataset.lbl = btn.textContent;
    btn.dataset.armed = '1';
    btn.textContent = '⚠ sure?';
    say(action==='ollama-stop'
      ? `Unload <b>${esc(model)}</b>? Frees its RAM now; it reloads on next use.`
      : `Warm up <b>${esc(model)}</b>? Loads it into memory (first load can take ~1 min).`);
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.textContent = btn.dataset.lbl || 'Warm'; } }, 4500);
    return;
  }
  if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; }
  btn.disabled = true;
  const t0 = btn.dataset.lbl || (action==='ollama-stop' ? 'Unload' : 'Warm');
  btn.textContent = action==='ollama-stop' ? '…unloading' : '…warming';
  say(`${action==='ollama-stop'?'Unloading':'Warming up'} <b>${esc(model)}</b> — working…`);
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, model, confirm: true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      if(action==='ollama-stop'){
        const freed = num(f.freedGb, 0);
        say(`<b style="color:var(--ok)">✓ unloaded</b> ${esc(model)}${freed>0.01?` — freed <b>${esc(fmtGb(freed))}</b>`:''}. Reloads on next use.`);
      } else {
        say(`<b style="color:var(--ok)">✓ warmed</b> ${esc(model)} in ${esc(String(num(f.tookSec,'—')))}s${f.route==='systemone'?' (decision-model route)':''}.`);
      }
    } else {
      say(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'fix failed')}</b>${j.error==='busy'?' — another fix is running, try again in a few seconds.':''}${j.report&&j.report.error?` — ${esc(LS(j.report.error))}`:''}`);
    }
  }catch(e){ say(`<b style="color:var(--bad)">✗ unreachable</b> — is the local server still running on 9111?`); }
  btn.disabled = false; btn.textContent = t0;
  LOCAL_REFRESH();
}
/* delegated: works because window bodies are rebuilt, listeners can't be per-render */
document.addEventListener('click', e => {
  const t = e.target.closest('#trimbtn'); if(t){ runFix('ollama-unload','Confirm trim'); return; }
  const s = e.target.closest('[data-stop]'); if(s){ runModelFix(s, 'ollama-stop', s.getAttribute('data-stop')); return; }
  const w2 = e.target.closest('[data-warm]'); if(w2){ runModelFix(w2, 'ollama-warm', w2.getAttribute('data-warm')); return; }
  const r = e.target.closest('#ramrefresh'); if(r){ LOCAL_REFRESH(); const o=$('#fixout'); if(o) o.textContent='refreshing…'; return; }
});

/* ---------- mobile vitals strip ----------
   One line, desktop numbers. Each figure is computed by the SAME variable or call the
   desktop desklets use (STACK, ageText(SNAP_RAW), snum(...)) — so the strip can never
   disagree with the Desk, and PR2's honest service states and stale-snapshot logic are
   reused rather than re-derived. Hidden on desktop by CSS.

   The strip fills itself highest-priority first and stops before the row would exceed its
   own width, so it is single-line and never overflows at any phone width. Priority:
   service health → snapshot age → projects → agents → reports → dev servers — the numbers
   the audit asked for survive; only the lowest-priority words are ever dropped. */
function renderVitals(){
  const el = $('#vitals'); if(!el) return;
  el.innerHTML = '';
  if(!el.clientWidth) return;                        // hidden (desktop) → nothing to render
  const snapCls = SNAP_STALE ? 'vwarn' : (SNAP_AGE===null ? 'vdim' : 'vok');
  /* PR4 item 3 — the counters are real buttons: focusable, Enter/Space activated, named,
     and >= 44px wide. Only the items that name a window become buttons (the snapshot age
     has no window behind it). */
  const item = (open, name, h) => open
    ? `<button class="vitem" data-open="${escAttr(open)}" aria-label="${escAttr(name)}">${h}</button>`
    : `<span class="vitem">${h}</span>`;
  /* A real separator between items: an aria-hidden divider (the visible tick) plus a
     literal space. The space is a whitespace-only flex child, so it is not rendered, but
     it keeps the DOM text "stack 6 2 0 | 1 day old …" readable to assistive tech and to
     anything reading textContent. */
  const sep = '<span class="vsep" aria-hidden="true"></span> ';
  const projName = 'projects ' + snum('projects', DATA.projects.length) + ' — open Projects';
  const itemDefs = [
    {open:'stack',    name:`services ${STACK.ok} clean, ${STACK.warn} non-2xx, ${STACK.bad} down — open Stack`,
     h:`<span class="vcap vdim">stack</span> <b class="vok">${STACK.ok}</b> <b class="vwarn">${STACK.warn}</b> <b class="vbad">${STACK.bad}</b>`},
    {open:null,       name:'',  h:`<b class="${snapCls}">${esc(ageText(SNAP_RAW))}</b>`},
    {open:'projects', name:projName,
     h:`<span class="vcap vdim">projects</span> <b class="vink">${snum('projects', DATA.projects.length)}</b>`},
    {open:'agents',   name:'agents ' + snum('roster', DATA.roster.length) + ' — open Agents',
     h:`<span class="vcap vdim">agents</span> <b class="vink">${snum('roster', DATA.roster.length)}</b>`},
    {open:'reports',  name:'reports ' + snum('reports', DATA.reports.length) + ' — open Reports',
     h:`<span class="vcap vdim">reports</span> <b class="vink">${snum('reports', DATA.reports.length)}</b>`},
    {open:'stack',    name:`dev servers ${DEV_ON} of ${DEV_TOTAL} online — open Stack`,
     h:`<span class="vcap vdim">dev</span> <b class="vink">${DEV_ON}/${DEV_TOTAL}</b>`},
  ];
  const items = itemDefs.map(it => item(it.open, it.name, it.h));
  el.innerHTML = items[0];                            // the health counts are never dropped
  for(let i=1;i<items.length;i++){
    const prev = el.innerHTML;
    el.innerHTML = prev + sep + items[i];
    if(el.scrollWidth > el.clientWidth + 1){ el.innerHTML = prev; break; }   // would overflow → stop
  }
  el.setAttribute('aria-label', el.textContent.replace(/\s+/g,' ').trim());
}

/* only real window definitions: an OWN property that carries a render function.
   Guards against inherited keys ("toString", "constructor", "__proto__"…) and junk ids. */
function winDef(id){
  if(typeof id!=='string') return null;
  if(!Object.prototype.hasOwnProperty.call(WINS, id)) return null;
  const d=WINS[id];
  return (d && typeof d.render==='function') ? d : null;
}
function openWin(id, restore=null){

  const vw = $('#desktop').clientWidth, vh = $('#desktop').clientHeight;
  const w = Math.min(def.w, vw - 24), h = Math.min(def.h, vh - 30);
  const off = (OPEN.size % 6) * 26;
  el.style.width = w+'px'; el.style.height = h+'px';
  el.style.left = clamp(vw/2 - w/2 + off, 6, Math.max(6, vw - w - 6)) + 'px';
  el.style.top = clamp((vh - h)/2 - 20 + off, 6, Math.max(6, vh - h - 6)) + 'px';
  el.innerHTML = `
    <div class="winbar">

/* Clearance between the bottom of #desktop (where windows are pinned) and the dock: the
   dock's own measured top edge plus a 10px breathing gap, so the safe-area inset is counted
   exactly once — it is already part of the dock's `bottom: 10px + var(--sab)`. Measured from
   the rect rather than recomputed from CSS, so it is correct for any inset value including
   0. A window's bottom edge therefore lands 10px above the dock's top edge. */
const DOCK_GAP = 10;
function dockClear(){ const d=$('#dock'); if(!d) return;
  const top = d.getBoundingClientRect().top;
  const clr = Math.round(innerHeight - top) + DOCK_GAP;
  document.documentElement.style.setProperty('--dock-clear', Math.max(56, clr) + 'px'); }
/* ---------- dock overflow affordance ----------
   The dock scrolls inside itself when the buttons cannot all fit (phones). Two cues, both
   absent when there is nothing more to scroll (and entirely at 1440px, where nothing
   overflows):
     1. an edge fade on the side that still hides buttons — the dock's mask is transparent
        at an edge only while that side has content (--dock-fade-l / --dock-fade-r);
     2. a track + thumb bar under the dock: thumb width = the visible fraction of the dock,
        thumb offset = scrollLeft from the start of the scrollable range to the end.
   The bar is placed in viewport coordinates with left/width only (no transform), and its
   extent is taken from the dock's measured rect, so it always sits inside the viewport,
   flush under the dock. Nothing here changes layout. */
function dockHint(){
  const d = $('#dock'), sc = $('#scroller'); if(!d || !sc) return;
  const total = d.scrollWidth, view = d.clientWidth;
  const max = total - view;
  const overflowing = max > 1;                                      // 0 → everything fits
  sc.classList.toggle('show', overflowing);
  if(!overflowing){ d.style.removeProperty('--dock-fade-l'); d.style.removeProperty('--dock-fade-r'); return; }
  /* edge fades: 22px while that side still has hidden content, 0 once it is reached */
  d.style.setProperty('--dock-fade-l', Math.min(22, d.scrollLeft) + 'px');
  d.style.setProperty('--dock-fade-r', Math.min(22, max - d.scrollLeft) + 'px');
  /* track+thumb, in viewport coordinates */
  const r = d.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, d.scrollLeft / max));
  const track = r.width;
  const thumb = Math.min(track, Math.max(28, track * (view/total)));
  sc.style.left = r.left + 'px';
  sc.style.width = track + 'px';
  const i = sc.firstElementChild;
  if(i){ i.style.width = thumb + 'px'; i.style.left = (frac * (track - thumb)) + 'px'; }
}
$('#dock').addEventListener('scroll', dockHint);

  markSel();
}
function markSel(){ document.querySelectorAll('.cmdrow').forEach(r=>r.classList.toggle('sel', +r.dataset.i===cmdIdx)); }
$('#cmdinput').addEventListener('input', e => cmdUpdate(e.target.value));
$('#cmdinput').addEventListener('keydown', e => {
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdIdx=Math.min(cmdIdx+1, cmdItems.length-1); markSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdIdx=Math.max(0, cmdIdx-1); markSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); const it=cmdItems[cmdIdx]; if(it){ hideCmd(); it.act(); } }
  else if(e.key==='Escape'){ hideCmd(); }
});
$('#cmdbar-wrap').addEventListener('click', e => { if(e.target.id==='cmdbar-wrap') hideCmd(); });
$('#cmdlist').addEventListener('click', e => { const r=e.target.closest('.cmdrow'); if(!r) return;
  const it=cmdItems[+r.dataset.i]; if(it){ hideCmd(); it.act(); } });
$('#cmdbtn').onclick = showCmd;
/* PR4 item 2 — Esc must never destroy a window. It closes the command palette if that is
   what is open; otherwise it blurs a focused window search box (so the filter box loses the
   keyboard without losing its text) and is otherwise a no-op. Windows close from their own
   close button only; there is no bare-Esc close and no other close shortcut in this build. */
addEventListener('keydown', e => {
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); showCmd(); return; }
  if(e.key !== 'Escape') return;
  if($('#cmdbar-wrap').classList.contains('show')){ hideCmd(); return; }   // palette first
  const t = e.target;
  if(t && typeof t.matches === 'function' && t.matches('input[data-filter]')){ t.blur(); return; }
  /* nothing else: the focused window stays open */
});

/* ---------- delegated clicks ----------
   One handler covers every "open something" affordance in the shell: the dock and menu,
   the desklet counters, the vitals-strip counters, project cards and agent cards. Buttons
   and role="button" elements fire click on Enter/Space by themselves, so the keyboard path
   and the pointer path share this code and can never drift apart. */
let lastOpenAt = 0;
function openTarget(el){
  const id = el.dataset.open;
  if(!id || !winDef(id)) return;                    // never open from an unknown id
  if(el.dataset.toggle !== undefined){              // dock buttons toggle minimize
    const w = OPEN.get(id);
    if(w && w.mode!=='min' && focusedId===id){ minWin(id); return; }
  }
  openWin(id);
}
document.addEventListener('click', e => {
  const cp = e.target.closest('[data-report]'); if(cp){ navigator.clipboard?.writeText(cp.dataset.report).catch(()=>{}); const t=cp.textContent; cp.textContent='copied ✓'; setTimeout(()=>cp.textContent=t, 900); return; }
  const cd = e.target.closest('.pcard[data-detail]'); if(cd){ try{ window.__detail(JSON.parse(cd.dataset.detail)); }catch(_){ } return; }
  const cg = e.target.closest('.agc[data-agent]'); if(cg){ const a=DATA.roster.find(x=>x.name===cg.dataset.agent); if(a) openAgent(a); return; }
  const cw = e.target.closest('[data-open]'); if(cw){ lastOpenAt = Date.now(); openTarget(cw); return; }
  const cf = e.target.closest('.chip[data-fam]'); if(cf){ projFilter = cf.dataset.fam || 'all';
    const w = OPEN.get('projects'); if(w && w.rerender) w.rerender(true); return; }
  const cl = e.target.closest('.chip[data-lib]'); if(cl){ libShelf = cl.dataset.lib || 'machine';
    const w = OPEN.get('reports'); if(w && w.rerender) w.rerender(true); return; }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ const dp=e.target.closest?.('.pcard[data-detail]'); if(dp){ try{ window.__detail(JSON.parse(dp.dataset.detail)); }catch(_){}} }
});
let __projq='', __repq='';
document.addEventListener('input', e => {
  const f = e.target.dataset && e.target.dataset.filter; if(!f) return;
  if(f==='projects') __projq = e.target.value;
  else if(f==='reports') __repq = e.target.value;
  else return;
  const w = OPEN.get(f); if(!w || !w.rerender) return;         // the window instance that owns this input
  const pos = e.target.selectionStart, val = e.target.value;
  w.rerender(true);
  const el2 = $('.winbody', w.el) && $('.winbody', w.el).querySelector(`input[data-filter="${f}"]`);
  if(el2){ el2.value = val; el2.focus(); try{ el2.setSelectionRange(pos, pos); }catch(_){} }
});

/* ---------- clock ---------- */
function tick(){ const el=$('#clock'); if(el){ const n=new Date(); el.textContent = n.toLocaleTimeString('en-ZA',{hour12:false}); } }
tick(); setInterval(tick, 1000);

/* ---------- start ---------- */
/* ================= PR4 item 1: deep links =================
   Grammar (the whole fragment, after ONE decodeURIComponent; the leading '#' is stripped):

     #<window-id>          open + focus that dock window.
                           ids: desk, projects, agents, reports, prds, stack, about.
     #project:<name>       open the project detail. <name> is URL-encoded; the first record
     #project:<name>@<n>   with that name, or the n-th (1-based, in data.js order).
                           n must be a plain integer 1..99 — "@2" disambiguates the eight
                           names that occur twice, and every one of the 56 records is
                           reachable: the 48 unique names via #project:<name>, the eight
                           duplicated names via <name> (1st) and <name>@2 (2nd).
     #agent:<name>         open that agent's detail (same safety rules as #project:).
     #report:<text>        keep the pre-PR4 behaviour: open Reports with the filter prefilled.
     anything else         nothing at all: unknown id, malformed/partial percent-encoding, an
                           over-long fragment, a name that doesn't exist as a project or
                           agent. No exception, no window, and nothing from the fragment ever
                           reaches the DOM unescaped (a link that matched no project opens
                           Projects with a short, escaped note; a link that matched no agent
                           does the same in Agents).

   Why an exact '@n' token and not a "contains" guess: a name may itself be any text, so the
   index is only read off a trailing token that is `@` + digits, the digits are 1..99, and the
   remaining name is matched exactly. A leading 1 can be written either way (x, x@1) — x@1 and
   x must land on the same record, and the test checks both.

   Unknown fragments deliberately stay silent: a shared link is not a form, so there is no one
   to tell, and a popup or a status line on someone else's URL would be worse than a no-op.
   A #project:/#agent: link is the one case where the user explicitly asked for an object, so
   that case answers with the list window plus a note instead of nothing. */
const HASH_MAX = 1000;
const PROJ_IDX_RE = /@(\d{1,2})$/;
function projectHashRef(p){            // the shareable form of one specific record
  let n = 1; for(const q of DATA.projects){ if(q.name===p.name){ if(q===p) break; n++; } }
  const base = encodeURIComponent(str(p.name||''));
  return n > 1 ? base + '@' + n : base;
}
function parseHash(hash){
  let raw = str(hash); if(raw.charAt(0)==='#') raw = raw.slice(1);
  if(!raw) return null;
  if(raw.length > HASH_MAX) return {kind:'invalid'};
  let h; try{ h = decodeURIComponent(raw); }catch(_){ return {kind:'invalid'}; }  // bad %-encoding
  if(!h) return null;
  /* window ids are matched as own properties of WINS only (never 'toString'/'__proto__').
     'detail' is excluded on purpose: it IS a real window, but only as the shell's own
     single reused detail view — a subjectless #detail would open an empty one, so it is a
     no-op like any other unknown fragment. */
  if(h.indexOf(':') < 0) return (h !== 'detail' && winDef(h)) ? {kind:'win', id:h} : {kind:'invalid'};
  const c = h.indexOf(':'), head = h.slice(0, c), rest = h.slice(c + 1);
  if(head === 'project'){
    if(!rest) return {kind:'invalid'};
    let n = 1, name = rest;
    const m = PROJ_IDX_RE.exec(rest);
    if(m && m.index > 0){ const k = parseInt(m[1],10); if(k < 1 || k > 99) return {kind:'invalid'}; name = rest.slice(0, m.index); n = k; }
    return DATA.projects.some(p => p.name === name) ? {kind:'project', name, n} : {kind:'projectMiss', name};
  }
  if(head === 'agent'){
    if(!rest) return {kind:'invalid'};
    return DATA.roster.some(a => a.name === rest) ? {kind:'agent', name:rest} : {kind:'agentMiss', name:rest};
  }
  if(head === 'report') return rest ? {kind:'report', q:rest} : {kind:'invalid'};
  return {kind:'invalid'};                       // #detail too: a subjectless detail is a no-op
}
let LINKED_DETAIL = null;                        // what the current window hash points at
/* A #project:/#agent: link that matched nothing answers with the list window plus one small,
   non-blocking line. The name waits in projNotice/agentNotice and the window's OWN renderer
   emits it — escaped — on its next pass, then clears it, so the note appears exactly once and
   can never race the window's deferred first render. Nothing from the URL is ever treated as
   markup. */
let projNotice = null, agentNotice = null;
function trunc(s, n){ s = str(s); return s.length > n ? s.slice(0, n) + '…' : s; }
function noticeWindow(id){
  const w = OPEN.get(id);
  if(w && w.rerender) w.rerender(true);           // already open → repaint it with the note
  else openWin(id);                               // fresh → its first render emits the note
}
function applyLink(p){
  if(!p) return;
  if(p.kind === 'win'){ openWin(p.id); return; }
  if(p.kind === 'project'){ openProjectByName(p.name, p.n); return; }
  if(p.kind === 'agent'){ openAgentByName(p.name); return; }
  if(p.kind === 'report'){
    openWin('reports');
    setTimeout(()=>{
      const q = document.querySelector('input[data-filter="reports"]');
      if(q){ q.value = p.q; q.dispatchEvent(new Event('input', { bubbles:true })); } }, 60);
    return; }
  if(p.kind === 'projectMiss'){ projNotice = trunc(p.name, 80); noticeWindow('projects'); return; }
  if(p.kind === 'agentMiss'){ agentNotice = trunc(p.name, 80); noticeWindow('agents'); return; }
  /* invalid / unknown: deliberately nothing — no window, no DOM, no throw */
}
function openProjectByName(name, n){
  n = n || 1; let seen = 0, hit = null;
  for(const p of DATA.projects){ if(p.name === name){ seen++; if(seen === n){ hit = p; break; } } }
  if(!hit) return applyLink({kind:'projectMiss', name});
  LINKED_DETAIL = {kind:'project', name, n};
  openDetail(hit);
}
function openAgentByName(name){
  const a = DATA.roster.find(x => x.name === name);
  if(!a) return applyLink({kind:'agentMiss', name});
  LINKED_DETAIL = {kind:'agent', name};
  openAgent(a);
}
function applyHash(){                              // onload and on every hashchange
  if(!DATA_OK) return;                             // no data → no window from a link
  if(Date.now() < HASH_SUPPRESS){                   // a Back press just consumed this URL
    try{ history.replaceState(history.state, '', location.pathname + location.search); }catch(_){}
    return;
  }
  let p; try{ p = parseHash(location.hash); }catch(_){ p = null; }
  if(!p) return;
  LINKING = true;
  try{ applyLink(p); } finally { LINKING = false; }
}
addEventListener('hashchange', applyHash);
addEventListener('pagehide', () => { LINKING = false; });   // never carry the flag across a page lifecycle
/* Whatever happened before the shell ran — a pre-data.js guard may have rendered the
   failure state and hidden the cockpit — markReady() undoes it, so the desktop and dock
   are visible and laid out before anything is measured or restored. Every path into the
   shell goes through here (normal, late recovery, near-timeout), so a late-recovered
   page is laid out exactly like a normally loaded one. */
function initShell(){
  /* A pre-data.js guard may have already painted the failure state and hidden the
     cockpit (a genuinely slow load). Un-hide it FIRST, before ANY measurement, so a
     late-recovered page measures the real desktop and restores exact geometry. This
     never creates an error node — on a healthy load it is a no-op. */
  ensureCockpitVisible();
  startBoot();
  renderDesklets(); renderDock(); renderGen(); renderVitals();
  dockClear();                       // desktop bottom now reflects the real dock height
  addEventListener('resize', () => { dockClear(); renderVitals(); dockHint(); });
  one(restoreLayout, null);          // windows restore against the real desktop size
  /* The link is applied last, so a linked window lands focused ON TOP of the restored
     layout instead of being buried under it. LINKING suppresses persist() for the whole
     application: following a link must not rewrite the saved layout. */
  one(applyHash, null);
  one(syncHash, null);               // a link-less URL keeps whatever the restore focused
  dockHint();                        // the dock is laid out now → fade/track reflect reality
  armGuard();                        // the first Back press closes a window instead of leaving
}
function describeRaw(v){
  if(v === undefined) return 'undefined — data.js did not load, or it failed to parse';
  if(v === null)      return 'null';
  if(Array.isArray(v)) return 'an array';
  return 'a ' + typeof v;
}
/* Boot protection is installed HERE, before the shell asks whether data arrived, so it
   covers a data.js that never loads, that is slow, that is not an object, or that throws
   mid-normalisation. The shell is built around `DATA`, and only afterwards does it look
   at MAIO_DATA at all — so building the shell can never be what takes the start down. */
let SHELL_BUILT = false;
try{ initShell(); SHELL_BUILT = true; }
catch(err){
  markFailed('The cockpit failed to start: ' + ((err && err.message) ? err.message : String(err)));
}
window.__maioShellDone = true;   // the shell ran to the end: the pre-guard's error net is no longer needed
if(SHELL_BUILT){
  if(DATA_OK){
    markReady();                 // one owner sets READY — and disarms a prior failure
    /* PR3: a first-time phone visitor lands on The Desk open, not an empty desktop.
       A returning visitor is left alone whenever a layout is on this device at all —
       including an empty one, which means "I closed everything" — so a phone visit can
       never overwrite or damage a layout saved on desktop. */
    const hadSaved = one(()=>Array.isArray(JSON.parse(localStorage.getItem('maioos.layout')||'null')), false);
    if(!OPEN.size && (!MOBILE || !hadSaved)) openWin('desk');
  } else {
    /* no usable snapshot: one consistent outcome is the failure state, whichever
       route got us here (404, syntax error, null/array/string, or a throw) */
    markFailed('window.MAIO_DATA is ' + describeRaw(RAW) + '.');
  }
}
/* BFCache / back-forward restore: a page restored from the cache never re-runs this
   script, so a healthy cockpit must simply come back. If a stale timer from the original
   load left the failure state behind, undo it and reveal the cockpit again. Nothing here
   may fail a page that was already healthy. */
addEventListener('pageshow', e => {
  if(!e.persisted) return;
  if(DATA_OK && SHELL_BUILT){
    markReady(); endBoot(); ensureCockpitVisible();
  } else if(uiState !== 'ready'){
    markFailed('window.MAIO_DATA is ' + describeRaw(RAW) + '.');
  }
});
</script>
