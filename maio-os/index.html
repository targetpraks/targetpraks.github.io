<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maio OS — Overview</title>
<meta name="description" content="Maio OS — the household cockpit: projects, agents, reports, PRDs, the live stack, the fleet kanban and this machine's vitals.">
<!-- Local assets and system fonts. The workspace makes no external font requests. -->
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<meta name="theme-color" content="#F7F4EC">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080b12; --bg2:#0b0f18; --panel:#10151f; --panel2:#141a26; --line:#1e2836; --line2:#2a3648;
  --ink:#e8eaf2; --body:#b9c1d0; --dim:#7e8898; --dim2:#5a6375;
  --gold:#d4a853; --gold-dim:#8a6f36; --ok:#6fbf8b; --warn:#e0b34c; --bad:#e07a6a; --blue:#7ea6d4;
  --grot:'Space Grotesk',system-ui,sans-serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--body);font-family:var(--sans);font-size:14px;line-height:1.55;
     -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
kbd{font-family:var(--mono);font-size:.72rem;background:var(--panel2);border:1px solid var(--line2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--dim)}

/* Shared section content */
.chiprow{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:.75rem;color:var(--dim);border:1px solid var(--line2);padding:3px 12px;border-radius:20px}
.chip:hover{color:var(--ink)}
.chip.on{color:var(--gold);border-color:var(--gold-dim);background:rgba(212,168,83,.07)}
.searchbox{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:8px;color:var(--ink);
           font:inherit;font-size:.85rem;padding:8px 12px;margin-bottom:14px}
.searchbox::placeholder{color:var(--dim2)}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;
       transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.pcard .pn{font-family:var(--grot);font-weight:500;color:var(--ink);font-size:.9rem;display:flex;align-items:center;gap:8px}
.pcard .pw{font-size:.76rem;color:var(--dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .pm{display:flex;gap:8px;align-items:center;margin-top:9px;font-family:var(--mono);font-size:.75rem;color:var(--dim2)}
.pcard .fam{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:1px 7px;border-radius:4px;background:var(--panel2);color:var(--dim)}
.fam.dev{color:var(--blue)} .fam.work{color:var(--gold)} .fam.pages{color:var(--ok)} .fam.venture{color:#c9a0e8}
.tagprd{color:var(--gold);border:1px solid var(--gold-dim);border-radius:4px;padding:0 5px;font-size:.72rem}
.rows{display:flex;flex-direction:column}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px;font-size:.8rem;border-bottom:1px solid rgba(30,40,54,.55)}
.rrow:hover{background:var(--panel)}
.rrow .ra{font-family:var(--grot);color:var(--ink);min-width:86px}
.rrow .rp{flex:1;min-width:0;color:var(--dim);font-family:var(--mono);font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .rd{font-family:var(--mono);font-size:.72rem;color:var(--dim2);white-space:nowrap}
.copy{font-family:var(--mono);font-size:.72rem;color:var(--dim2);border:1px solid var(--line2);border-radius:5px;padding:1px 7px;flex:none}
.copy:hover{color:var(--gold);border-color:var(--gold-dim)}
.svcgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.svc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.svc .sn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.svc .sn b{font-family:var(--grot);font-weight:500;font-size:.84rem;color:var(--ink)}
.svc .sp{font-family:var(--mono);font-size:.75rem;color:var(--dim2);margin-top:4px}
.svc .snote{font-size:.75rem;color:var(--dim2);margin-top:6px}
.agentgrid{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
/* PR4 item 4 — an agent card is a real control that opens the agent's detail window.
   Cards are block-level in a grid, so a taller card pushes the row down instead of
   overlapping its neighbour (the same rule PR3 used for .pcard/.rrow). */
.agc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
     cursor:pointer;transition:border-color .15s,transform .15s;text-align:left;
     display:flex;gap:10px;align-items:flex-start}
.agc:hover{border-color:var(--gold-dim);transform:translateY(-1px)}
.agc:hover .an{color:var(--gold)}
.agc .body{min-width:0;flex:1}
/* the illustrated cast (maio-cast): one face per agent next to the name. A missing
   face falls back to a monogram in the same circle, so the grid never breaks. */
.agc .ava{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:0 0 auto;
     background:var(--panel);border:2px solid var(--line);display:block}
img.agc-face{border-color:var(--ink);box-shadow:3px 3px 0 rgba(226,164,69,.35)}
.agc .mono{font-family:var(--mono);font-size:.75rem;color:var(--dim2);
     display:flex;align-items:center;justify-content:center;letter-spacing:.06em}
.agc .sheet{font-family:var(--mono);font-size:.72rem;color:var(--gold);margin-top:5px;
     display:inline-block;border-bottom:1px solid rgba(226,164,69,.4)}
.agc .an{font-family:var(--grot);font-weight:500;color:var(--ink);font-size:.85rem}
.agc .ar{font-size:.72rem;color:var(--dim);margin-top:3px;min-height:2.1em}
.agc .al{font-family:var(--mono);font-size:.72rem;color:var(--dim2);margin-top:6px}
.agc .al b{color:var(--gold);font-weight:500}
.adev{display:flex;gap:12px;align-items:flex-start}
img.castface{display:block;width:96px;height:96px;border-radius:50%;object-fit:cover;
     border:2px solid var(--ink);box-shadow:4px 4px 0 rgba(226,164,69,.35);margin:0 0 12px}
.aglyph{font-size:1.15rem;flex:none;line-height:1.2}
.empty{color:var(--dim2);font-size:.8rem;padding:22px;text-align:center}
/* PR4 item 5 — a stack URL is a real link under PR2's allow-list, so the ones that are
   not allowed through (or missing) stay plain text. These are localhost / LAN addresses
   that only resolve on Ricardo's own network; that is expected and nothing is added. */
.svcurl{display:inline-block;word-break:break-all;max-width:100%}
.sect{font-family:var(--grot);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin:18px 0 9px}
.sect:first-child{margin-top:2px}
.notebox{background:rgba(212,168,83,.07);border:1px solid rgba(212,168,83,.25);border-radius:10px;padding:11px 14px;font-size:.78rem;color:var(--body)}
.notebox b{color:var(--gold)}
.notebox.warnbox{background:rgba(224,179,76,.10);border-color:rgba(224,179,76,.42)}
.notebox.warnbox b{color:var(--warn)}
.aboutp{font-size:.84rem;color:var(--body);max-width:70ch;margin-bottom:11px}
.aboutp b{color:var(--ink)}
.phases{display:grid;gap:10px;margin-top:6px}
.phase{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.phase .pn2{font-family:var(--mono);color:var(--gold);font-size:.75rem;flex:none;padding-top:2px}
.phase .pt{font-size:.82rem;color:var(--ink);font-weight:500}
.phase .pd{font-size:.76rem;color:var(--dim);margin-top:2px}
.dhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dname{font-family:var(--grot);font-weight:600;font-size:1.05rem;color:var(--ink);letter-spacing:-.01em}
.drows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.drow{display:flex;gap:14px;padding:9px 2px;border-bottom:1px solid rgba(30,40,54,.55);font-size:.82rem}
.dk{flex:none;width:92px;font-family:var(--mono);font-size:.75rem;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;padding-top:3px}
.dv{flex:1;min-width:0;color:var(--body);word-break:break-word}
.dv code{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.dfoot{margin-top:14px}

</style>

<!-- ============ v2 daylight integration ============================
     Local layer + new windows. Everything here is optional garnish that
     never touches the shell's data contract: local.js (written by the local
     server on 127.0.0.1:9111, absent on the public site) upgrades the
     Machine + Kanban windows from "generator snapshot" to "live". -->
<style>
/* logo marks (kit) */
#logo .lg{border-radius:5px;vertical-align:-3px;margin-right:7px}
.bootmark{display:block;width:min(225px,60vw);height:auto}
/* window icons from the sprite share .di's slot; nudge down 1px */
.dockbtn .di.ic{line-height:1}
.di.ic svg{width:20px;height:20px;display:block}
/* local badges + the Machine section layout */
.lbadge{font-size:.72rem;font-family:var(--mono);letter-spacing:.04em;padding:2px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--dim2);white-space:nowrap}
.lbadge.live{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.lbadge.off{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.lbadge.err{color:var(--bad);border-color:var(--bad-line);background:var(--bad-soft)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.mcard{background:var(--panel);border:var(--hair) solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:12px 14px}
.mcard h2.card-title, .mcard h5{font-family:var(--grot);font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-bottom:8px}
.mkv{display:flex;justify-content:space-between;gap:10px;font-size:.8rem;padding:2.5px 0}
.mkv b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.mnote{font-size:.72rem;color:var(--dim2);margin-top:7px}
.msess{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.msess:last-child{border-bottom:none}
.msess .mico{width:20px;text-align:center;flex:none;color:var(--gold)}
.msess .mmeta{margin-left:auto;font-family:var(--mono);font-size:.72rem;color:var(--dim2);text-align:right}
.kbcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:6px}
.kbcol h2.card-title, .kbcol h5{font-family:var(--grot);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:0 0 6px}
.kbcard{background:var(--panel);border:var(--hair) solid var(--line);border-radius:var(--radius-sm);box-shadow:var(--shadow-1);padding:8px 10px;margin-bottom:7px;font-size:.78rem}
.kbcard .kbt{color:var(--ink);line-height:1.35}
.kbcard .kbm{margin-top:5px;display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.75rem;color:var(--dim2)}
.kbcard .kbm .as{color:var(--gold)}
.slowchip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-family:var(--mono);padding:3px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--dim2);max-width:100%;flex-wrap:wrap;overflow-wrap:anywhere}
.slowchip.hi{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
/* mini RAM gauge in the Machine section */
.mgauge{height:11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);overflow:hidden;margin:7px 0 3px}
.mgauge i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#127248,#4FB183)}
.mgauge.warn i{background:linear-gradient(90deg,#8A5807,#E7B84B)}
.mgauge.bad i{background:linear-gradient(90deg,#B02A2A,#E8735F)}
/* Ollama rows in the Machine section: per-model unload / warm up (v2.1) */
.orow{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line);font-size:.8rem}
.orow:last-child{border-bottom:none}
.orow .onm{font-family:var(--mono);font-size:.72rem;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .omt{font-family:var(--mono);font-size:.75rem;color:var(--dim2);white-space:nowrap}
.obtn{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:var(--radius-xs);border:1px solid var(--line2);background:var(--panel);color:var(--dim2);cursor:pointer;white-space:nowrap}
.obtn:hover{border-color:var(--gold-dim);color:var(--gold);background:var(--gold-soft)}
.obtn.warn:hover{border-color:var(--bad-line);color:var(--bad);background:var(--bad-soft)}
.obtn:disabled{opacity:.5;cursor:default}
/* desklet polish on the light theme: one-line names, tidy pills, breathing room */
.desklet{padding-bottom:16px}
.vrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow .pill{font-size:.75rem;padding:1px 7px;white-space:nowrap}
/* v2.2 — the Library (Reports window): shelves + cards that say where each thing lives */
.lbadge.pub{color:var(--gold);border-color:var(--gold-dim);background:var(--gold-soft)}
.lbadge.vault{color:var(--cyber-magenta-ink);border-color:rgba(244,63,122,.45);background:var(--cyber-magenta-soft)}
.libgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));margin-top:10px}
.libcard{background:var(--panel);border:var(--hair) solid var(--line);border-radius:var(--radius-sm);
         box-shadow:var(--shadow-1);padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.libcard:hover{border-color:var(--gold-dim);box-shadow:var(--shadow-2), var(--ring-gold)}
.libcard .lt{font-family:var(--grot);font-weight:600;color:var(--ink);font-size:.87rem;line-height:1.32;overflow-wrap:anywhere}
.libcard .lm{font-family:var(--mono);font-size:.75rem;color:var(--dim2);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.libcard .lp{font-family:var(--mono);font-size:.72rem;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.libcard .lacts{display:flex;gap:7px;align-items:center;margin-top:auto;padding-top:7px;flex-wrap:wrap}
.btn.sm{font-size:.72rem;padding:5px 10px;gap:6px}
.shelfnote{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}
/* v3 — two-way actions (Stack section) + the Vault window */
.svc-actions{display:flex;flex-direction:column;gap:6px}
.svcrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.8rem}
.svcrow:last-child{border-bottom:none}
.svcrow .snm{font-family:var(--grot);font-weight:600;font-size:.78rem;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Vault window */
.vaultbar{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
.vaultbar .searchbox{flex:1}
.vreslist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.vres{display:flex;gap:10px;align-items:baseline;padding:8px 10px;border:var(--hair) solid var(--line);border-radius:var(--radius-sm);background:var(--panel);cursor:pointer}
.vres:hover{border-color:var(--gold-dim);box-shadow:var(--shadow-1)}
.vres .vt{font-family:var(--grot);font-weight:600;font-size:.83rem;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vres .vk{font-family:var(--mono);font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--dim2);flex:none}
.vres .vp{font-family:var(--mono);font-size:.72rem;color:var(--dim2);flex:none;max-width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vinfo{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:4px 0 8px}
.vnotetext{font-family:var(--mono);font-size:.72rem;color:var(--body);white-space:pre-wrap;word-break:break-word;
           background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;
           max-height:420px;overflow:auto;line-height:1.55}
.vbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;
        padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim2)}
.vbadge.ro{color:var(--cyber-cyan-ink);border-color:rgba(15,181,201,.4);background:var(--cyber-cyan-soft)}
/* v4 — the File reader (read-only document reader) + the new window feel */

.fileframe{width:100%;height:min(60vh,540px);border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.fileimg{display:flex;justify-content:center}
.fileimg img{max-width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}

<body>
<a class="skip-link" href="#workspace">Skip to content</a>
<div class="app-shell">
  <aside id="sidebar" aria-label="Workspace navigation">
    <a class="brand" href="#overview" data-open="overview" aria-label="Maio OS overview">
      <img src="assets/glyph.svg" width="32" height="32" alt="">
      <span>maio<span class="brand-dot">.</span>os</span>
    </a>
    <div class="sidebar-caption">Your household, organised.</div>
    <nav id="section-nav" aria-label="Sections"></nav>
    <div class="sidebar-footer">
      <div class="profile"><span class="profile-avatar" aria-hidden="true">RM</span><div><b>Ricardo Maio</b><span>Personal workspace</span></div></div>
    </div>
  </aside>
  <div class="main-shell">
    <header id="topbar">
      <nav id="breadcrumbs" aria-label="Breadcrumb">Workspace</nav>
      <div class="topbar-actions"><span id="genned"></span><button id="cmdbtn" aria-label="Search workspace"><svg class="nav-icon" aria-hidden="true"><use href="assets/icons.svg#i-search"></use></svg><span>Search</span><kbd>⌘ K</kbd></button></div>
    </header>
    <main id="workspace" tabindex="-1">
      <div id="page-host"><div id="boot" role="status">Loading your workspace…</div></div>
    </main>
  </div>
</div>

<script>
/* Boot guard — must run BEFORE the data.js request is issued.

   A synchronous <script src="data.js"> blocks the parser, so if that request is slow or
   never answered, nothing after it runs: no watchdog, no click-to-skip, no failure state.
   The boot screen would stay up for good. So the protection lives here, ahead of the
   request: a self-contained inline script with its own timeout. It is removed as soon as
   the shell script below has installed its own boot handlers. */
(function(){
  var boot = document && document.getElementById ? document.getElementById('boot') : null;
  /* ONE owner of the ready/failed decision, shared by this guard and the shell below.
     'loading' → nothing decided yet; 'ready' → valid data + shell started; 'failed' → error.
     A timer may only ever move loading → failed. Once ready, nothing may regress it. */
  window.__maioState = 'loading';
  function dataPresent(){
    var d = window.MAIO_DATA;   // set by data.js, whenever it arrived
    return d !== null && typeof d === 'object' && !Array.isArray(d);
  }
  function paintFail(detail){
    if(window.__maioState === 'ready') return;        // never replace a healthy cockpit
    if(boot) boot.remove();
    /* hide the cockpit behind the error; the shell un-hides exactly these on recovery */
    ['page-host','section-nav'].forEach(function(id){ var el=document.getElementById(id); if(el) el.style.display='none'; });
    var e = document.getElementById('dataerr');
    if(!e){
      e = document.createElement('div'); e.id = 'dataerr'; e.setAttribute('role','alert');
      e.innerHTML = '<div class="errbox">' +

   inside the memory chip — shorten to head…tail so both ends stay identifiable. */
const bigName = s => { s = str(s); return s.length <= 26 ? s : s.slice(0,15) + '…' + s.slice(-9); };
function agoTxt2(t){ const s=str(t); if(!s) return ''; const d=new Date(s); if(isNaN(d)) return ''; const mins=Math.floor((Date.now()-d)/60000);
  if(mins<2) return 'just now'; if(mins<60) return mins+' min ago';
  const h=Math.floor(mins/60); if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago'; }

  const pct = num(ram.usedPct, 0);
  const cls = slow && slow.level==='HIGH' ? 'bad' : (pct>=75 ? 'warn' : '');
  const top = Array.isArray(ram.top) ? ram.top.slice(0,6) : [];
  return `<div class="mcard"><h2 class="card-title">Memory · ${esc(fmtGb(ram.usedPct!=null? (num(ram.totalGb,0)*num(ram.usedPct,0)/100) : null))} of ${esc(fmtGb(ram.totalGb))} used</h2>

/* Where the fix action lives: same-origin when the page IS the local build (9111 or
   through the tailnet proxy); otherwise the loopback address, which the server accepts
   only when the request's Origin matches its allow-list — so the public Pages copy can
   never fire a fix. LOCAL_BASE is the same rule for the vault reads. */
const LOCAL_BASE = (() => {
  try{ const h=location.hostname, p=location.port;
    if(location.protocol.indexOf('http')===0 && (p==='9111' || h.endsWith('.ts.net'))) return ''; }catch(_){}
  return 'http://127.0.0.1:9111';
})();
const FIX_URL = LOCAL_BASE + '/api/fix';
/* Last action message, kept outside the DOM: window rerenders (every 30 s, and
   after each action) rebuild the cards, so a plain assignment to #fixout would
   vanish within seconds. fixSay() updates both the store and the live node. */
let FIX_MSG = '';
const fixSay = html => { FIX_MSG = String(html); const o = $('#fixout'); if(o) o.innerHTML = FIX_MSG; };
async function runFix(action, confirmLabel){
  const btn = $('#trimbtn');
  if(!$('#fixout')) return;
  if(btn && btn.dataset.armed !== '1'){
    btn.dataset.armed = '1'; const t0 = btn.innerHTML;
    btn.textContent = '⚠ ' + (confirmLabel || 'Confirm?') + ' — click again';
    fixSay('This unloads local Ollama models to free memory. They reload automatically on next use.');
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.innerHTML = t0; } }, 4500);
    return;
  }
  if(btn){ btn.dataset.armed='0'; btn.disabled = true; }
  fixSay('working — unloading…');
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, confirm: true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      const freed = num(f.freedGb, 0);
      const un = Array.isArray(f.unloaded) ? f.unloaded : [];
      fixSay((freed >= 0.05 || un.length)
        ? `<b style="color:var(--ok)">✓ trimmed</b> — memory ${esc(String(f.beforeUsedPct))}% ${MARK_ARROW} ${esc(String(f.afterUsedPct))}%, freed <b>${esc(fmtGb(freed))}</b>` +
          (un.length ? ` · unloaded ${un.map(x=>esc(LS(x))).join(', ')}` : '')
        : `<b style="color:var(--ok)">✓ nothing to unload</b> — no Ollama models were loaded (memory stays at ${esc(String(f.beforeUsedPct))}%).`);
    } else {
      fixSay(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'fix failed')}</b>` + (j.error==='busy'?' — another fix is already running, try again in a few seconds.':''));
    }
  }catch(e){ fixSay(`<b style="color:var(--bad)">✗ unreachable</b> — the local server answered the page but not the action. Is it still running on 9111?`); }
  if(btn){ btn.disabled = false; btn.innerHTML = `${sprIcon('i-bolt')} Trim RAM`; }
  LOCAL_REFRESH();
}
/* Per-model actions from the Local models card: Unload (data-stop) / Warm (data-warm).
   Two-click confirm on the row button itself; output goes to the RAM card's #fixout. */
async function runModelFix(btn, action, model){
  const out = $('#fixout');
  const say = html => { FIX_MSG = String(html); if(out) out.innerHTML = FIX_MSG; };
  if(btn.dataset.armed !== '1'){
    // remember the pristine label once, so it can be restored after the action
    if(!btn.dataset.lbl) btn.dataset.lbl = btn.innerHTML;
    btn.dataset.armed = '1';
    btn.textContent = '⚠ sure?';
    say(action==='ollama-stop'
      ? `Unload <b>${esc(model)}</b>? Frees its RAM now; it reloads on next use.`
      : `Warm up <b>${esc(model)}</b>? Loads it into memory (first load can take ~1 min).`);
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.innerHTML = btn.dataset.lbl || 'Warm'; } }, 4500);
    return;
  }
  if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; }
  btn.disabled = true;
  const t0 = btn.dataset.lbl || (action==='ollama-stop' ? 'Unload' : 'Warm');
  btn.textContent = action==='ollama-stop' ? '…unloading' : '…warming';
  say(`${action==='ollama-stop'?'Unloading':'Warming up'} <b>${esc(model)}</b> — working…`);
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action, model, confirm: true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      if(action==='ollama-stop'){
        const freed = num(f.freedGb, 0);
        say(`<b style="color:var(--ok)">✓ unloaded</b> ${esc(model)}${freed>0.01?` — freed <b>${esc(fmtGb(freed))}</b>`:''}. Reloads on next use.`);
      } else {
        say(`<b style="color:var(--ok)">✓ warmed</b> ${esc(model)} in ${esc(String(num(f.tookSec,'—')))}s${f.route==='systemone'?' (decision-model route)':''}.`);
      }
    } else {
      say(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'fix failed')}</b>${j.error==='busy'?' — another fix is running, try again in a few seconds.':''}${j.report&&j.report.error?` — ${esc(LS(j.report.error))}`:''}`);
    }
  }catch(e){ say(`<b style="color:var(--bad)">✗ unreachable</b> — is the local server still running on 9111?`); }
  btn.disabled = false; btn.innerHTML = t0;
  LOCAL_REFRESH();
}
/* delegated: works because window bodies are rebuilt, listeners can't be per-render */
document.addEventListener('click', e => {
  const t = e.target.closest('#trimbtn'); if(t){ runFix('ollama-unload','Confirm trim'); return; }
  const s = e.target.closest('[data-stop]'); if(s){ runModelFix(s, 'ollama-stop', s.getAttribute('data-stop')); return; }
  const w2 = e.target.closest('[data-warm]'); if(w2){ runModelFix(w2, 'ollama-warm', w2.getAttribute('data-warm')); return; }
  const r = e.target.closest('#ramrefresh'); if(r){ LOCAL_REFRESH(); const o=$('#fixout'); if(o) o.textContent='refreshing…'; return; }
  const sr = e.target.closest('[data-svc]'); if(sr){ runServiceFix(sr, sr.getAttribute('data-svc')); return; }
  const rf = e.target.closest('#refreshdata'); if(rf){ runRefreshData(rf); return; }
  const vl = e.target.closest('[data-vopen]'); if(vl){ vaultOpen(vl.getAttribute('data-vopen')); return; }
  const vb = e.target.closest('#vaultback'); if(vb){ vaultView=null; const w=VIEWS.get('vault'); if(w && w.rerender) w.rerender(true); return; }
});

/* ---------- v3: two-way actions — service restart + data refresh (Stack section)
   These post to the SAME guarded /api/fix lane as the ollama actions; the server
   owns the allowlist, cooldowns and origin checks. Message store per window so a
   30-s rebuild never loses the last result. */
let SVC_MSG = '';
const svcSay = html => { SVC_MSG = String(html); const o=$('#svcout'); if(o) o.innerHTML = SVC_MSG; };
async function runServiceFix(btn, label){
  if(btn.dataset.armed !== '1'){
    if(!btn.dataset.lbl) btn.dataset.lbl = btn.textContent;
    btn.dataset.armed = '1';
    btn.textContent = '⚠ sure?';
    if(label==='com.maio.gate-mcp') svcSay(`Restart <b>Gate MCP</b>? Live agent MCP sessions using the gates drop briefly while it respawns.`);
    else if(label==='com.maio.ok-vault-server') svcSay(`Restart <b>OK vault server</b>? Vault reads (and the Vault section's search) pause for a few seconds.`);
    else svcSay(`Restart <b>${esc(label)}</b>? launchd relaunches it; the service blinks for a few seconds.`);
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.innerHTML = btn.dataset.lbl || (`${sprIcon('i-bolt-ok')} Restart`); } }, 4500);
    return;
  }
  btn.dataset.armed='0'; btn.disabled = true;
  const t0 = btn.dataset.lbl || (`${sprIcon('i-bolt-ok')} Restart`);
  btn.textContent = '…restarting';
  svcSay(`Restarting <b>${esc(label)}</b> — working…`);
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'service-restart', label, confirm:true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      svcSay(`<b style="color:var(--ok)">✓ restarted</b> ${esc(f.name||label)} — pid ${esc(String(num(f.beforePid,'—')))} ${MARK_ARROW} ${esc(String(num(f.afterPid,'—')))}${f.afterRunning?' · running':''}.`);
    } else {
      const extra = j.error==='cooldown' ? ` — wait ${esc(String(num(j.retryInSec,'')))}s before restarting this again.` :
                    j.error==='busy' ? ' — another fix is running, try again in a few seconds.' : '';
      svcSay(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'restart failed')}</b>${extra}${j.report&&j.report.error?` — ${esc(LS(j.report.error))}`:''}`);
    }
  }catch(e){ svcSay(`<b style="color:var(--bad)">✗ unreachable</b> — is the local server still running on 9111?`); }
  btn.disabled = false; btn.textContent = t0;
  LOCAL_REFRESH();
}
async function runRefreshData(btn){
  if(btn.dataset.armed !== '1'){
    btn.dataset.armed = '1'; const t = btn.innerHTML;
    btn.textContent = '⚠ confirm refresh — click again';
    svcSay(`Re-scan the machine and regenerate <b>data.js</b> now (the generator also runs on its own schedule). Takes ~10–25 s.`);
    setTimeout(()=>{ if(btn.dataset.armed==='1'){ btn.dataset.armed='0'; btn.innerHTML = t; } }, 4500);
    return;
  }
  btn.dataset.armed='0'; btn.disabled = true; btn.textContent = '…refreshing';
  svcSay('Refreshing data — scanning services and regenerating data.js…');
  try{
    const r = await fetch(FIX_URL, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'refresh-data', confirm:true }) });
    const j = await r.json().catch(()=>({}));
    if(j && j.ok && j.report){
      const f = j.report;
      if(f.noChange) svcSay(`<b style="color:var(--ok)">✓ refreshed</b> — ran ${esc(String(f.lastDone||''))}; no data change (everything already current).`);
      else if(f.pushed) svcSay(`<b style="color:var(--ok)">✓ refreshed</b> — data.js regenerated and pushed at ${esc(String(f.lastDone||''))}.`);
      else if(f.regenerated) svcSay(`<b style="color:var(--warn)">✓ regenerated</b> — data.js updated at ${esc(String(f.lastDone||''))}, but the auto-commit/push did not confirm. Check the refresh log.`);
      else svcSay(`<b style="color:var(--warn)">✓ ran</b> — refresh completed at ${esc(String(f.lastDone||''))}; no file change detected yet.`);
    } else {
      const extra = j.error==='cooldown' ? ` — wait ${esc(String(num(j.retryInSec,'')))}s before refreshing again.` :
                    j.error==='busy' ? ' — another fix is running, try again in a few seconds.' : '';
      svcSay(`<b style="color:var(--warn)">✗ ${esc(LS(j.error)||'refresh failed')}</b>${extra}`);
    }
  }catch(e){ svcSay(`<b style="color:var(--bad)">✗ unreachable</b> — is the local server still running on 9111?`); }
  btn.disabled = false; btn.innerHTML = `${sprIcon('i-bolt-ok')} Refresh data`;
  LOCAL_REFRESH();
}
/* Recent actions (the fix log, read-only) — rendered in the Machine section so the
   two-way layer is auditable at a glance. Fetched from /api/fix/log (last 50). */
async function loadFixLog(){
  const out = $('#fixhist');
  if(!out) return;
  /* The log lives on the companion origin only. Asking for it from another origin is a
     guaranteed CORS refusal, so we skip the request and say so plainly. */
  if(!ON_COMPANION){ out.innerHTML = '<div class="empty">action history needs the local server</div>'; return; }
  try{
    const r = await fetch(FIX_URL.replace(/\/api\/fix$/, '/api/fix/log'), { method:'GET' });
    const j = await r.json().catch(()=>null);
    if(!Array.isArray(j)){ out.innerHTML = '<div class="empty">no action history yet</div>'; return; }
    out.innerHTML = j.slice(-12).reverse().map(e=>{
      const ts = LS(e.ts||'').replace('T',' ').slice(0,16);
      const act = LS(e.action||'').replace('ollama-','');
      const target = LS(e.label || e.model || '');
      let res = '';
      if(e.action==='service-restart') res = e.ok ? `pid ${num(e.beforePid,'—')}${MARK_ARROW}${num(e.afterPid,'—')}` : LS(e.error||'failed');
      else if(e.action==='refresh-data') res = e.pushed ? 'regenerated + pushed' : e.noChange ? 'no change' : (e.ran ? 'ran' : LS(e.error||'failed'));
      else res = e.freedGb!=null ? `freed ${fmtGb(e.freedGb)}` : (e.ok===false && e.error ? LS(e.error) : (e.ok ? 'ok' : ''));
      return `<div class="fh"><span class="fht">${esc(ts)}</span><span class="fha" style="color:${e.ok===false?'var(--bad)':'var(--ok)'}">${esc(act)}</span><span>${esc(target)}</span><span class="fhr">${esc(String(res))}</span></div>`;
    }).join('') || '<div class="empty">no action history yet</div>';
  }catch(e){ out.innerHTML = '<div class="empty">action history needs the local server</div>'; }
}

function renderKanban(){
  const k = LSEC('kanban');
  const sy = one(()=>isObj(D.system)? D.system : null, null);

  const counts = k && isObj(k.counts) ? k.counts : (snap && isObj(snap.counts) ? snap.counts : null);

/* Only real section definitions: an OWN property that carries a render function.
   Guards against inherited keys ("toString", "constructor", "__proto__"…) and junk ids. */
function sectionDef(id){
  if(typeof id!=='string') return null;
  if(!Object.prototype.hasOwnProperty.call(SECTIONS, id)) return null;
  const d=SECTIONS[id];
  return (d && typeof d.render==='function') ? d : null;
}
/* Each section owns its content and scroll position. No geometry, z-index or window state. */
function parentSection(id){
  if(id==='detail') return detailAgent ? 'agents' : 'projects';
  if(id==='file') return 'reports';
  return id;
}
function pageScroller(){return $('#workspace');}
/* A section is reused once built, so its scroll position survives — but the Library's shelf
   and filter and the Search box are part of what the section SHOWS, not just of its data.
   A route that changes them (#docs:<title> after #reports, Back, a nav click after a filtered
   link) must re-render, or the reader sees the previous view under a new URL. */
function sectionStateKey(id){
  if(id==='reports') return str(libShelf)+'\u0000'+str(__repq);
  return '';
}
/* "Open the Library" means the unfiltered Library: clear the hash-derived filter state. */
function clearSectionRoute(id){
  if(id==='reports'){ __repq=''; libShelf=LIB_DEFAULT; }
}
function showSection(id){
  if(!DATA_OK) return;
  const def=sectionDef(id); if(!def) return;
  const key=sectionStateKey(id);
  const prev=VIEWS.get(activeSection);
  if(prev) prev.scroll=pageScroller().scrollTop;
  let inst=VIEWS.get(id);
  if(!inst){
    const el=document.createElement('section');
    el.className='section-page'; el.dataset.section=id;
    el.innerHTML=`<header class="page-heading"><h1 class="page-title" tabindex="-1">${esc(def.title)}</h1><p class="page-description">${esc(def.sub)}</p></header><div class="section-body"></div>`;
    inst={el,scroll:null,sig:key};
    inst.rerender=()=>{
      /* every render — including the ones a chip or the filter input triggers directly —
         records the state it drew, so the next route change compares like with like */
      inst.sig=sectionStateKey(id);
      const body=$('.section-body',el);
      const active=el.contains(document.activeElement) ? document.activeElement : null;
      const filter=active?.dataset.filter;
      const pos=filter ? active.selectionStart : null;
      body.innerHTML=safeHtml(()=>def.render(id));
      body.querySelectorAll('input[data-filter]').forEach(input=>input.setAttribute('aria-label',input.placeholder));
      if(filter){ const input=body.querySelector(`input[data-filter="${filter}"]`); input?.focus({preventScroll:true}); if(input && pos!==null) input.setSelectionRange(pos,pos); }
    };
    VIEWS.set(id,inst); inst.rerender();
  } else if(inst.sig!==key){
    inst.sig=key;
    inst.rerender();
  }
  const changed=activeSection!==id;
  activeSection=id;
  $('#page-host').replaceChildren(inst.el);
  if(changed){
    pageScroller().scrollTop=inst.scroll||0;
  }
  updatePageContext();
  syncHash();
  if(changed && DATA_READY) $('.page-title',inst.el)?.focus({preventScroll:true});
}
function updatePageContext(){
  const id=activeSection, parent=parentSection(id), def=sectionDef(parent);
  if(!def) return;
  const title=id==='detail' ? (detailAgent?.name || detailProject?.name || def.title)
    : id==='file' ? (fileRef?.title || fileBaseName(fileRef?.rel) || 'Document') : def.title;
  const group=sectionGroup(parent);
  $('#breadcrumbs').innerHTML=id!==parent
    ? `<a href="#${escAttr(parent)}" data-open="${escAttr(parent)}">${esc(def.title)}</a><span class="crumb-separator" aria-hidden="true">/</span><span aria-current="page">${esc(title)}</span>`
    : `<span>${esc(group)}</span><span class="crumb-separator" aria-hidden="true">/</span><span aria-current="page">${esc(title)}</span>`;
  document.querySelectorAll('.nav-link[data-open]').forEach(a=>{
    const selected=a.dataset.open===parent;
    if(selected) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    /* On phones the rail scrolls sideways: bring the current chip into view so a deep
       link never lands on a section whose chip is off-screen. Desktop is a no-op. */
    if(selected && a.parentElement && getComputedStyle(a.parentElement).display === 'contents'){
      const nav = a.closest('#section-nav');
      if(nav && nav.scrollWidth > nav.clientWidth){
        const r = a.getBoundingClientRect(), nr = nav.getBoundingClientRect();
        if(r.left < nr.left || r.right > nr.right) nav.scrollLeft += (r.left - nr.left) - 12;
      }
    }
  });
  document.title=title+' — Maio OS';
}
function hashFor(){
  if(activeSection==='detail'){
    if(detailAgent) return '#agent:'+encodeURIComponent(detailAgent.name);
    if(detailProject) return '#project:'+projectHashRef(detailProject);

  if(activeSection==='file') return fileRef ? '#file:'+encodeURIComponent(fileRef.rel) : '#reports';
  if(activeSection==='reports' && __repq) return (libShelf==='docs'?'#docs:':'#report:')+encodeURIComponent(__repq);

function syncHash(){
  if(LINKING || !DATA_OK) return;
  const next=hashFor();
  if(location.hash===next) return;
  try{history[DATA_READY?'pushState':'replaceState']({maioSection:activeSection},'',next);}catch(_){/* Restricted embeds can still navigate sections in memory. */}

function fmtBytes(n){ const x=num(n,null); if(x==null) return '—'; if(x<1024) return x+' B'; if(x<1048576) return (x/1024).toFixed(1)+' KB'; return (x/1048576).toFixed(1)+' MB'; }
/* ---------- v4: the File reader — read a machine-only document inside the cockpit ----------
   The Read-Room's job, folded in: the same read-only /files route the Report cards used to
   open in a tab now renders here instead. HTML/PDF/SVG run in a frame (the server already
   sets the sandbox CSP on them); images render inline; text-ish files (md/txt/csv/json) are
   fetched and shown as plain text — nothing from a file is ever treated as markup by this
   shell. On the public build there is no local server, so the window degrades to an honest
   note. One window, reused: opening another file retargets it, like the detail window. */
const FILE_EXTS = new Set(['.html','.htm','.md','.pdf','.png','.jpg','.jpeg','.webp','.svg','.txt','.csv','.json','.jsonl']);
const FILE_FRAME = new Set(['.html','.htm','.pdf','.svg']);
const FILE_IMG = new Set(['.png','.jpg','.jpeg','.webp']);
let fileRef = null;        // {rel, title, ext} — the document the File reader shows
let fileState = null;      // {loading|err|text|html|img, size, truncated}
let fileSeq = 0;           // stale-response guard when the target is switched quickly
function fileSeg(rel){ return String(rel).split('/').map(encodeURIComponent).join('/'); }
function fileBaseName(rel){ const s = str(rel); const i = s.lastIndexOf('/'); return i >= 0 ? s.slice(i+1) : s; }
function fileHrefOf(rel){ return LOCAL_BASE + '/files/' + fileSeg(rel); }
function fileSetTitle(){
  const w=VIEWS.get('file'); if(!w) return;
  $('.page-title',w.el).textContent=fileRef ? (fileRef.title||fileBaseName(fileRef.rel)) : 'Document';
  $('.page-description',w.el).textContent=fileRef?.rel||'';
  updatePageContext();
}
function fileRepaint(){ VIEWS.get('file')?.rerender(); }
function openFile(f){
  if(!f || typeof f.rel!=='string' || !f.rel) return;
  const rel=str(f.rel), segs=rel.split('/'), ext=(rel.match(/\.[a-z0-9]+$/i)||[''])[0].toLowerCase();
  if(rel.length>300 || rel.charAt(0)==='/' || rel.indexOf('\0')>=0 || segs.some(s=>!s||s.charAt(0)==='.') || !FILE_EXTS.has(ext)) return;
  fileRef={rel,title:str(f.title)||'',ext}; fileState=null; ++fileSeq;
  const w=VIEWS.get('file'); if(w){w.scroll=null;w.rerender();}
  showSection('file'); fileSetTitle();
  if(LOCAL_BASE==='') fileLoad();
}

async function fileLoad(){
  if(!fileRef) return;
  const my = ++fileSeq;
  const href = fileHrefOf(fileRef.rel);
  fileState = {loading:true}; fileRepaint();
  try{
    const r = await fetch(href, { method:'HEAD' });
    if(my !== fileSeq) return;
    if(!r.ok){ fileState = {err:'the file is not there (' + r.status + ') — it may have been moved or renamed'}; fileRepaint(); return; }
    const size = num(r.headers.get('content-length'), null);
    const ext = fileRef.ext;
    if(FILE_FRAME.has(ext)){ fileState = {html:true, size}; fileRepaint(); return; }
    if(FILE_IMG.has(ext)){ fileState = {img:true, size}; fileRepaint(); return; }
    const g = await fetch(href);
    if(my !== fileSeq) return;
    const t = await g.text();
    const cap = 524288;
    fileState = {text: t.slice(0, cap), truncated: t.length > cap, size};
  }catch(e){ if(my !== fileSeq) return; fileState = {err:'could not reach the local server'}; }
  if(my !== fileSeq) return;
  fileRepaint();
}
function renderFileBody(){
  if(!fileRef) return `<div class="empty">no file picked — open one from Reports ${MARK_ARROW} Machine (Read), or follow a #file: link</div>`;
  const name = fileRef.title || fileBaseName(fileRef.rel);
  const href = fileHrefOf(fileRef.rel);
  const up = (LOCAL_BASE === '');
  const st = fileState || {};
  let h = `<div class="vinfo">
      <span class="vt" style="font-family:var(--grot);font-weight:600;font-size:.84rem;color:var(--ink)">${esc(name)}</span>
      <span class="vbadge">${esc(fileRef.rel)}</span>
      ${st.size != null ? `<span class="vbadge">${esc(fmtBytes(st.size))}</span>` : ''}
      ${up ? `<a class="btn sm" href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">Open in a tab ${MARK_UPRIGHT}</a>` : ''}
      <button class="copy" data-report="${escAttr('AI-Drive/' + fileRef.rel)}" aria-label="${escAttr('Copy path for ' + name)}">path ${sprIcon('i-copy')}</button>
    </div>`;
  if(!up) return h + `<div class="notebox" style="margin-top:10px"><b>Machine-only file</b> — this document lives on the Mac and is served by the local companion. Open the cockpit from the local build (<span style="font-family:var(--mono)">http://127.0.0.1:9111</span> or the tailnet) to read it here.</div>`;
  if(st.err) return h + `<div class="notebox" style="border-color:var(--bad-line)"><b style="color:var(--warn)">✗ ${esc(st.err)}</b></div>`;
  if(st.loading) return h + '<div class="mnote">loading…</div>';
  if(st.text != null) return h + `<div class="vnotetext">${esc(st.text)}${st.truncated ? '\n\n… truncated at 512 KB — open in a tab for the rest.' : ''}</div>`;
  if(st.img) return h + `<div class="fileimg"><img src="${escAttr(href)}" alt="${escAttr(name)}"></div>`;

    <div class="mnote">served read-only from this Mac — if the frame stays empty the file may be gone; <a href="${escAttr(href)}" target="_blank" rel="noopener noreferrer">open it in a tab</a>.</div>`;
  return h;
}

/* ---------- bookmarkable section routes ---------- */
const HASH_MAX=512, PROJ_IDX_RE=/@(\d+)$/;
function projectHashRef(p){            // the shareable form of one specific record
  let n = 1; for(const q of DATA.projects){ if(q.name===p.name){ if(q===p) break; n++; } }
  const base = encodeURIComponent(str(p.name||''));
  return n > 1 ? base + '@' + n : base;
}
function parseHash(hash){
  let raw = str(hash); if(raw.charAt(0)==='#') raw = raw.slice(1);
  if(!raw) return null;
  if(raw.length > HASH_MAX) return {kind:'invalid'};
  let h; try{ h = decodeURIComponent(raw); }catch(_){ return {kind:'invalid'}; }  // bad %-encoding
  if(!h) return null;
  if(h==='desk') return {kind:'section',id:'overview'};
  /* Section ids are matched as own properties of SECTIONS only (never 'toString'/'__proto__').
     'detail' and 'file' are excluded on purpose: they ARE real windows, but only as the
     shell's own single reused views — a subjectless #detail or #file would open an empty
     one, so both are a no-op like any other unknown fragment. */
  if(h.indexOf(':') < 0) return (h !== 'detail' && h !== 'file' && sectionDef(h)) ? {kind:'section', id:h} : {kind:'invalid'};
  const c = h.indexOf(':'), head = h.slice(0, c), rest = h.slice(c + 1);
  if(head === 'project'){
    if(!rest) return {kind:'invalid'};
    let n = 1, name = rest;
    const m = PROJ_IDX_RE.exec(rest);
    if(m && m.index > 0){ const k = parseInt(m[1],10); if(k < 1 || k > 99) return {kind:'invalid'}; name = rest.slice(0, m.index); n = k; }
    return DATA.projects.some(p => p.name === name) ? {kind:'project', name, n} : {kind:'projectMiss', name};
  }
  if(head === 'agent'){
    if(!rest) return {kind:'invalid'};
    return DATA.roster.some(a => a.name === rest) ? {kind:'agent', name:rest} : {kind:'agentMiss', name:rest};
  }
  if(head === 'file'){
    /* #file:<path under AI-Drive> — the deep link publish-document hands out for machine-only
       documents. Validated like the server's /files route: relative only, no dot-segments, a
       displayable extension. Anything else is a quiet no-op. */
    const rel = str(rest);
    if(!rel || rel.length > 300 || rel.charAt(0) === '/' || rel.indexOf('\0') >= 0) return {kind:'invalid'};
    const segs = rel.split('/');
    if(segs.some(s => !s || s.charAt(0) === '.')) return {kind:'invalid'};
    const ext = (rel.match(/\.[a-z0-9]+$/i) || [''])[0].toLowerCase();
    return FILE_EXTS.has(ext) ? {kind:'file', rel} : {kind:'invalid'};
  }
  if(head==='report'||head==='docs') return rest ? {kind:'report',q:rest,shelf:head==='docs'?'docs':'machine'} : {kind:'invalid'};
  return {kind:'invalid'};                       // #detail too: a subjectless detail is a no-op
}
/* A #project:/#agent: link that matched nothing answers with the list window plus one small,
   non-blocking line. The name waits in projNotice/agentNotice and the window's OWN renderer
   emits it — escaped — on its next pass, then clears it, so the note appears exactly once and
   can never race the window's deferred first render. Nothing from the URL is ever treated as
   markup. */
let projNotice = null, agentNotice = null;
function trunc(s, n){ s = str(s); return s.length > n ? s.slice(0, n) + '…' : s; }
function noticeSection(id){
  const w=VIEWS.get(id); if(w) w.rerender();
  showSection(id);
}
function applyLink(p){
  if(!p) return;
  /* A plain section route is the section itself — never a view left over from the last
     #docs:/#report: link, so the hash and what is on screen agree again (Back included). */
  if(p.kind==='section'){clearSectionRoute(p.id);showSection(p.id);return;}
  if(p.kind==='project'){openProjectByName(p.name,p.n);return;}
  if(p.kind==='agent'){openAgentByName(p.name);return;}
  if(p.kind==='file'){openFile({rel:p.rel});return;}
  if(p.kind==='report'){
    __repq=p.q; libShelf=p.shelf||'machine';
    showSection('reports');          // the state key changed, so the section re-renders once
    return;
  }
  if(p.kind==='projectMiss'){projNotice=trunc(p.name,80);noticeSection('projects');return;}
  if(p.kind==='agentMiss'){agentNotice=trunc(p.name,80);noticeSection('agents');}
}

function openProjectByName(name, n){
  n = n || 1; let seen = 0, hit = null;
  for(const p of DATA.projects){ if(p.name === name){ seen++; if(seen === n){ hit = p; break; } } }
  if(!hit) return applyLink({kind:'projectMiss', name});
  openDetail(hit);
}
function openAgentByName(name){
  const a = DATA.roster.find(x => x.name === name);
  if(!a) return applyLink({kind:'agentMiss', name});
  openAgent(a);
}
function applyHash(){
  if(!DATA_OK) return;
  const route=one(()=>parseHash(location.hash),null);
  LINKING=true;
  try{
    if(route && route.kind!=='invalid') applyLink(route);
    else showSection('overview');
  }finally{LINKING=false;}
}
addEventListener('hashchange',applyHash);
function initShell(){
  ensureCockpitVisible(); startBoot(); renderNavigation(); renderGen();
  if(DATA_OK){applyHash();if(!location.hash) syncHash();}
}

function describeRaw(v){
  if(v === undefined) return 'undefined — data.js did not load, or it failed to parse';
  if(v === null)      return 'null';
  if(Array.isArray(v)) return 'an array';
  return 'a ' + typeof v;
}
/* Boot protection is installed HERE, before the shell asks whether data arrived, so it
   covers a data.js that never loads, that is slow, that is not an object, or that throws
   mid-normalisation. The shell is built around `DATA`, and only afterwards does it look
   at MAIO_DATA at all — so building the shell can never be what takes the start down. */
let SHELL_BUILT = false;
try{ initShell(); SHELL_BUILT = true; }
catch(err){
  markFailed('The cockpit failed to start: ' + ((err && err.message) ? err.message : String(err)));
}
window.__maioShellDone = true;   // the shell ran to the end: the pre-guard's error net is no longer needed
if(SHELL_BUILT){
  if(DATA_OK){
    markReady();                 // one owner sets READY — and disarms a prior failure
  } else {
    /* no usable snapshot: one consistent outcome is the failure state, whichever
       route got us here (404, syntax error, null/array/string, or a throw) */
    markFailed('window.MAIO_DATA is ' + describeRaw(RAW) + '.');
  }
}
/* BFCache / back-forward restore: a page restored from the cache never re-runs this
   script, so a healthy cockpit must simply come back. If a stale timer from the original
   load left the failure state behind, undo it and reveal the cockpit again. Nothing here
   may fail a page that was already healthy. */
addEventListener('pageshow', e => {
  if(!e.persisted) return;
  if(DATA_OK && SHELL_BUILT){
    markReady(); endBoot(); ensureCockpitVisible();
  } else if(uiState !== 'ready'){
    markFailed('window.MAIO_DATA is ' + describeRaw(RAW) + '.');
  }
});
</script>
</body>
</html>
