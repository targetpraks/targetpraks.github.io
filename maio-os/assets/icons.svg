<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <!-- Maio OS icon sprite — 24x24 grid, 1.75 stroke, round caps/joins.
         Usage: <svg class="ic"><use href="assets/icons.svg#i-desk"/></svg> -->
  </defs>

  <!-- i-desk: the Desk — a monitor on a stand -->
  <symbol id="i-desk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.75" y="4.25" width="18.5" height="12.5" rx="2.25"/>
    <path d="M9 20.25h6"/>
    <path d="M12 16.75v3.5"/>
    <path d="M6.25 8.5h5"/>
  </symbol>

  <!-- i-projects: stacked layers -->
  <symbol id="i-projects" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.25 21.25 8 12 12.75 2.75 8z"/>
    <path d="m3.5 12.4 8.5 4.35 8.5-4.35"/>
    <path d="m3.5 16.4 8.5 4.35 8.5-4.35"/>
  </symbol>

  <!-- i-agents: person with a node -->
  <symbol id="i-agents" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9.5" cy="7.5" r="3.5"/>
    <path d="M3.25 20.25c0-3.45 2.8-5.75 6.25-5.75 1.28 0 2.34.28 3.2.77"/>
    <circle cx="17.75" cy="17.75" r="2.5"/>
    <path d="M17.75 13.75v1.5M17.75 20.25v1.5M13.75 17.75h1.5M20.25 17.75h1.5"/>
  </symbol>

  <!-- i-reports: document with lines -->
  <symbol id="i-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.25 2.75h7.5l4.75 4.75v13.5a.75.75 0 0 1-.75.75H6.25a.75.75 0 0 1-.75-.75V3.5a.75.75 0 0 1 .75-.75Z"/>
    <path d="M13.5 2.75V7.5h5"/>
    <path d="M8.5 12.25h7M8.5 15.75h7M8.5 19h4"/>
  </symbol>

  <!-- i-prds: notebook with a pen -->
  <symbol id="i-prds" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.25 3.75h10.5v16.5H5.25a1 1 0 0 1-1-1V4.75a1 1 0 0 1 1-1Z"/>
    <path d="M5.25 16.25h10.5"/>
    <path d="M8.25 7.5h4.5M8.25 11h3"/>
    <path d="m18.4 8.6 2 2-5.4 5.4-2.7.7.7-2.7z"/>
  </symbol>

  <!-- i-stack: server rack -->
  <symbol id="i-stack" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.25" y="3.75" width="17.5" height="6.5" rx="1.75"/>
    <rect x="3.25" y="13.75" width="17.5" height="6.5" rx="1.75"/>
    <path d="M7 7h.01M7 17h.01"/>
    <path d="M11 7h4M11 17h4"/>
  </symbol>

  <!-- i-about: info circle -->
  <symbol id="i-about" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.25"/>
    <path d="M12 11.25v5.5"/>
    <path d="M12 7.6h.01"/>
  </symbol>

  <!-- i-search: magnifier -->
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.75" cy="10.75" r="6.75"/>
    <path d="m15.6 15.6 5.15 5.15"/>
  </symbol>

  <!-- i-kanban: board with three columns (the Desk window) -->
  <symbol id="i-kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.25" y="4.25" width="17.5" height="15.5" rx="2.25"/>
    <path d="M9 4.25v15.5M15 4.25v15.5"/>
    <path d="M6.1 8h.01M12.1 11h.01M18.1 8h.01"/>
  </symbol>

  <!-- i-machine: cpu chip -->
  <symbol id="i-machine" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.25" y="6.25" width="11.5" height="11.5" rx="1.75"/>
    <rect x="10" y="10" width="4" height="4" rx=".75"/>
    <path d="M9.25 3.25v3M14.75 3.25v3M9.25 17.75v3M14.75 17.75v3"/>
    <path d="M3.25 9.25h3M3.25 14.75h3M17.75 9.25h3M17.75 14.75h3"/>
  </symbol>

  <!-- i-bolt: action / fix (filled spark) -->
  <symbol id="i-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13.6 2.75 5.9 12.4a.55.55 0 0 0 .43.9h4.6l-1.5 8.05 7.7-9.65a.55.55 0 0 0-.43-.9h-4.6z"/>
  </symbol>

  <!-- i-bolt-ok: action resolved (check in a soft-disc) -->
  <symbol id="i-bolt-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9.25"/>
    <path d="m7.75 12.35 2.85 2.9 5.65-6.5"/>
  </symbol>
</svg>
